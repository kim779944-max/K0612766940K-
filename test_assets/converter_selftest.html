<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>변환기 문서 전체 복제 자가검증</title>
<style>html,body{margin:0;height:100%}iframe{border:0;width:100%;height:100%}#out{display:none}</style></head>
<body>
<!-- 사용법(PC): chrome --headless=new --allow-file-access-from-files --virtual-time-budget=30000 --dump-dom 이파일
     · 기준 응답(elevator_notice_ai.json)을 실제 변환기(oneclick/converter.html)의 docFromRaw → buildAndShow 흐름에 넣어
       만들어진 .hwpx/.xlsx 를 base64로 #out 에 적습니다(검증 스크립트가 파일로 풀어 내용 검사). -->
<iframe id="f" src="../oneclick/converter.html"></iframe>
<pre id="out"></pre>
<script>
const f = document.getElementById('f');
const b64 = async blob => { const u8 = new Uint8Array(await blob.arrayBuffer()); let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
/* ?viewer-hwpx / ?viewer-xlsx : 만든 파일을 더뷰(viewer.html)로 넘겨 화면을 찍는다 · 해시 없음: 변환기 결과 화면 */
let stage = 0;
f.onload = async () => {
  if (stage++) return;
  const out = document.getElementById('out');
  try{
    const w = f.contentWindow;
    const raw = await (await fetch('elevator_notice_ai.json')).json();
    /* ?legacy : 예전 '표 하나' 경로(붙여넣기·기기 안 인식)가 그대로 동작하는지 */
    const st = /legacy/.test(location.search)
      ? w.structFromText('품목\t수량\t금액\n볼펜\t10\t5,000\n노트\t3\t₩12,000')
      : w.docFromRaw(raw, 'elevator_notice_test.jpg');
    if (/legacy/.test(location.search)) st.cells[0].bg = '#D9E2F3';
    await w.eval('(async st => { CUR = st; CUR_NAME = "승강기_정기점검_안내"; await buildAndShow(false); })')(st);
    const last = w.eval('LAST');
    out.textContent = JSON.stringify({ok:true, counts:w.docCounts(st), colors:[...new Set(w.docColors(st))],
      hwpx:await b64(last.hwpx), xlsx:await b64(last.xlsx), resVisible:w.document.getElementById('res').style.display});
    const m = /viewer-(hwpx|xlsx)/.exec(location.search + location.hash);
    if (m){
      const name = '승강기_정기점검_안내.' + m[1];
      const blob = last[m[1]];
      f.onload = async () => { await f.contentWindow.showFile(new File([blob], name)); document.title = 'VIEWER'; };
      f.src = '../oneclick/viewer.html';
    }
  }catch(e){ out.textContent = JSON.stringify({ok:false, err:String(e && e.stack || e)}); }
  document.title = 'DONE';
};
</script>
</body></html>
