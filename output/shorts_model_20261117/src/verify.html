<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}video{display:block;width:540px;height:960px}</style></head>
<body><video id="v" muted playsinline preload="auto"></video>
<script>
const v = document.getElementById('v');
v.src = new URLSearchParams(location.search).get('f') || '../short_converter_model_9x16.mp4';
window.info = () => ({duration: v.duration, w: v.videoWidth, h: v.videoHeight, ready: v.readyState});
window.seek = t => new Promise(ok => { v.onseeked = () => requestAnimationFrame(() => requestAnimationFrame(() => ok(v.currentTime))); v.currentTime = t; });
window.audioCheck = async () => { v.muted = false; v.volume = 0.01; v.currentTime = 3; await v.play(); await new Promise(r => setTimeout(r, 1500)); v.pause();
  return {audioTracks: v.captureStream().getAudioTracks().length, audioBytes: v.webkitAudioDecodedByteCount, videoBytes: v.webkitVideoDecodedByteCount, frames: v.getVideoPlaybackQuality().totalVideoFrames}; };
</script></body></html>
