<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>반려동물·식물 케어 주기 계산 · KTS 원클릭</title>
<meta name="theme-color" content="#0A1128">
<style>
/*@@CSS@@*/
.pf{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pf button{font-size:12px;font-weight:800;color:#DCE6F2;border:1px solid var(--line2);border-radius:999px;padding:6px 10px;background:var(--card2)}
.tk{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.tk b{color:#fff}.tk .dt{color:var(--or2);font-weight:900;text-align:right}
.tk small{grid-column:1/3;color:var(--sub);font-size:11px;line-height:1.5}
.tk.due .dt{color:var(--red)}
.who{font-size:13px;font-weight:900;color:#fff;margin-top:12px}
</style></head>
<body><div id="app">
<!--@@TOP 반려동물 · 식물 케어 주기@@-->
<main>
<section class="hero">
 <h1>마지막으로 한 날짜만 넣으면<br><em>다음 케어 일정</em>과 캘린더 파일</h1>
 <p>종·나이·체중·환경에 맞는 일반 권장 주기로 다음 날짜를 계산하고, 근거를 함께 보여 줍니다. 약품 이름·용량은 표시하지 않습니다.</p>
</section>
<section class="card">
 <h2><span class="n">1</span>아이 · 식물 정보</h2>
 <div class="row"><button class="btn sec sm" id="sampleBtn">예시: 개 · 고양이 · 몬스테라</button></div>
 <div class="g2"><div><label class="lb">종류</label><select id="type"><option value="dog">개</option><option value="cat">고양이</option><option value="plant">관엽식물</option></select></div><div><label class="lb">이름</label><input id="name" maxlength="20"></div></div>
 <div id="petF"><div class="g2"><div><label class="lb">나이(살)</label><input id="age" inputmode="decimal"></div><div><label class="lb">체중(kg)</label><input id="kg" inputmode="decimal"></div></div>
  <div class="g2"><div><label class="lb">중성화</label><select id="neut"><option value="y">했음</option><option value="n">안 했음</option></select></div><div><label class="lb">털 길이</label><select id="coat"><option value="short">단모</option><option value="long">장모</option></select></div></div></div>
 <div id="plantF" class="hide"><div class="g2"><div><label class="lb">위치</label><select id="place"><option value="in">실내</option><option value="out">실외·베란다</option></select></div><div><label class="lb">햇빛</label><select id="sun"><option value="low">적음</option><option value="mid">보통</option><option value="high">많음</option></select></div></div></div>
 <label class="lb">마지막으로 한 날 <i>모르면 비워 두세요(오늘 기준으로 표시)</i></label>
 <div id="lastF"></div>
 <div class="row"><button class="btn sec sm" id="addBtn">이 아이 목록에 추가</button></div>
 <div class="pf" id="profiles"></div>
</section>
<button class="btn pri" id="runBtn" style="margin-top:14px">다음 일정 계산</button>
<section class="card hide" id="result">
 <h2><span class="n">2</span>케어 일정</h2>
 <div class="stat"><div><b id="sN">0</b><span>등록</span></div><div><b id="sMonth">0</b><span>이번 달 할 일</span></div><div><b id="sDue">0</b><span>날짜 지남</span></div></div>
 <div class="row"><button class="btn pri sm" id="icsBtn">캘린더(.ics) 받기</button><button class="btn sec sm" id="printBtn">이번 달 인쇄</button><button class="btn sec sm" id="copyBtn">복사</button></div>
 <div id="list"></div>
 <p class="fixnote">일반 권장 주기이며 아이 상태에 따라 수의사·전문가와 상담하세요.</p>
</section>
<!--@@BOTTOM@@-->
</main></div>
<div id="toast"></div><div id="printArea"></div>
<script>
/*@@JS@@*/
/* 일반 권장 주기(일) + 근거. 약품·용량은 넣지 않음 */
function tasks(p){
  const a = +p.age || 0, kg = +p.kg || 0, senior = a >= 7;
  if (p.type === 'dog') return [
   ['vac', '종합 예방접종(추가 접종)', a < 1 ? null : 365, a < 1 ? '1살 미만은 기초 접종 일정이 따로 있어 수의사 일정을 따릅니다' : '성견 일반 권장: 연 1회 추가 접종'],
   ['rab', '광견병 예방접종', a < 0.3 ? null : 365, '일반 권장: 연 1회'],
   ['hw', '심장사상충 예방', 30, '일반 권장: 매월 1회'],
   ['ext', '외부 기생충 예방', 30, '일반 권장: 매월 1회(계절·생활환경에 따라 다름)'],
   ['int', '내부 기생충 예방', 90, '일반 권장: 3개월마다'],
   ['bath', '목욕', kg >= 15 ? 28 : 21, `체중 ${kg || '?'}kg → ${kg >= 15 ? '중·대형견 약 4주' : '소형견 약 3주'} (피부 상태에 따라 조절)`],
   ['groom', '미용·털 정리', p.coat === 'long' ? 42 : 90, p.coat === 'long' ? '장모: 약 6주' : '단모: 약 3개월(빗질은 매일)'],
   ['chk', '건강검진', senior ? 182 : 365, senior ? `${a}살(7살 이상) → 6개월마다` : '7살 미만 → 연 1회']];
  if (p.type === 'cat') return [
   ['vac', '종합 예방접종(추가 접종)', a < 1 ? null : 365, a < 1 ? '1살 미만은 기초 접종 일정이 따로 있어 수의사 일정을 따릅니다' : '일반 권장: 연 1회(실내묘는 수의사와 간격 상담)'],
   ['ext', '외부 기생충 예방', 30, '일반 권장: 매월 1회'],
   ['int', '내부 기생충 예방', 90, '일반 권장: 3개월마다'],
   ['nail', '발톱 정리', 14, '일반 권장: 약 2주'],
   ['groom', '빗질·털 관리', p.coat === 'long' ? 2 : 7, p.coat === 'long' ? '장모: 이틀에 한 번' : '단모: 주 1회'],
   ['chk', '건강검진', senior ? 182 : 365, senior ? `${a}살(7살 이상) → 6개월마다` : '7살 미만 → 연 1회']].concat(p.neut === 'n' ? [['neut', '중성화 상담', null, '중성화 전이면 시기를 수의사와 상담']] : []);
  const m = new Date().getMonth() + 1, winter = m <= 2 || m === 12, base = {low:10, mid:7, high:5}[p.sun] + (p.place === 'out' ? -1 : 0), water = winter ? Math.round(base * 1.5) : base;
  return [
   ['water', '물 주기', water, `햇빛 ${{low:'적음', mid:'보통', high:'많음'}[p.sun]} · ${p.place === 'out' ? '실외' : '실내'}${winter ? ' · 겨울(간격 1.5배)' : ''} → 약 ${water}일 (겉흙이 마르면)`],
   ['feed', '비료', winter ? null : 30, winter ? '겨울(12~2월)은 비료를 쉽니다' : '봄~가을: 월 1회'],
   ['leaf', '잎 닦기·해충 확인', 14, '일반 권장: 2주마다'],
   ['repot', '분갈이', 365, '일반 권장: 1~2년(뿌리가 화분 밖으로 나오면 앞당김)'],
   ['prune', '가지치기', 365, '일반 권장: 연 1회(봄)']];
}
const LABEL = {dog:'개', cat:'고양이', plant:'식물'};
let PROF = LS.get('kts_petcare_v1', []), CUR = null;
function lastInputs(){
  const t = tasks(readForm());
  $('#lastF').innerHTML = t.map(([k, n]) => `<div class="g2" style="align-items:center;margin-top:4px"><span style="font-size:12px;color:#C6D0DF;font-weight:700">${n}</span><input type="date" data-k="${k}"></div>`).join('');
}
function readForm(){ const last = {}; $$('#lastF input').forEach(i => { if (i.value) last[i.dataset.k] = i.value; }); return {type:$('#type').value, name:$('#name').value.trim() || LABEL[$('#type').value], age:num($('#age').value), kg:num($('#kg').value), neut:$('#neut').value, coat:$('#coat').value, place:$('#place').value, sun:$('#sun').value, last}; }
function showType(){ const pl = $('#type').value === 'plant'; $('#petF').classList.toggle('hide', pl); $('#plantF').classList.toggle('hide', !pl); lastInputs(); }
function profBar(){ $('#profiles').innerHTML = PROF.map((p, i) => `<button data-i="${i}">${LABEL[p.type]} · ${esc(p.name)} ✕</button>`).join(''); $$('#profiles button').forEach(b => b.onclick = () => { PROF.splice(+b.dataset.i, 1); LS.set('kts_petcare_v1', PROF); profBar(); }); }
function addProf(){ const p = readForm(); PROF.push(p); LS.set('kts_petcare_v1', PROF); profBar(); toast(`${p.name}을(를) 목록에 넣었습니다`); }
function run(){
  if (!PROF.length) addProf();
  const today = parseD(todayS()), mEnd = new Date(today.getFullYear(), today.getMonth() + 1, 0);
  const R = PROF.map(p => ({p, items:tasks(p).map(([k, n, days, why]) => { const ld = parseD(p.last[k]); let next = null, due = false;
    if (days){ next = ld ? addDays(ld, days) : today; if (ld && next < today) due = true; }
    return {k, n, days, why, last:ld, next, due}; })}));
  CUR = R; render();
}
function render(){
  const today = parseD(todayS()), mEnd = new Date(today.getFullYear(), today.getMonth() + 1, 0); const all = CUR.flatMap(r => r.items.filter(i => i.next).map(i => Object.assign({who:r.p.name}, i)));
  $('#sN').textContent = CUR.length; $('#sMonth').textContent = all.filter(i => i.next <= mEnd).length; $('#sDue').textContent = all.filter(i => i.due).length;
  $('#list').innerHTML = CUR.map(r => `<div class="who">${LABEL[r.p.type]} · ${esc(r.p.name)} ${r.p.type === 'plant' ? '' : `<span style="font-weight:400;color:var(--sub);font-size:11px">${isFinite(r.p.age) ? r.p.age + '살' : ''} ${isFinite(r.p.kg) ? r.p.kg + 'kg' : ''}</span>`}</div>` + r.items.map(i => `<div class="tk ${i.due ? 'due' : ''}"><b>${i.n}</b><span class="dt">${i.next ? (i.due ? '지남 · ' : '') + korD(i.next) : '수의사 상담'}</span><small>${i.days ? `주기 ${i.days}일 · ` : ''}마지막 ${i.last ? ymd(i.last) : '기록 없음(오늘 기준)'} · 근거: ${esc(i.why)}</small></div>`).join('')).join('');
  $('#result').classList.remove('hide'); $('#result').scrollIntoView({block:'start'}); window.scrollBy(0, -60);
}
function events(){ const ev = []; CUR.forEach(r => r.items.filter(i => i.next).forEach(i => { for (let n = 0; n < 3; n++){ const d = addDays(i.next, i.days * n); ev.push({date:d < parseD(todayS()) ? parseD(todayS()) : d, title:`[${r.p.name}] ${i.n}`, desc:`${i.why} · 일반 권장 주기이며 아이 상태에 따라 수의사·전문가와 상담하세요.`}); } })); return ev; }
const monthList = () => { const mEnd = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0); return CUR.flatMap(r => r.items.filter(i => i.next && i.next <= mEnd).map(i => ({who:r.p.name, n:i.n, d:i.next, due:i.due}))).sort((a, b) => a.d - b.d); };
$('#type').onchange = showType;
$('#sampleBtn').onclick = () => { const t = todayS(), b = n => ymd(addDays(new Date(), -n));
  PROF = [{type:'dog', name:'콩이', age:4, kg:6.5, neut:'y', coat:'long', place:'in', sun:'mid', last:{vac:b(300), rab:b(330), hw:b(25), ext:b(35), int:b(80), bath:b(18), groom:b(50), chk:b(200)}},
   {type:'cat', name:'나비', age:9, kg:4.2, neut:'y', coat:'short', place:'in', sun:'mid', last:{vac:b(350), ext:b(20), int:b(100), nail:b(10), groom:b(5), chk:b(190)}},
   {type:'plant', name:'몬스테라', age:NaN, kg:NaN, neut:'y', coat:'short', place:'in', sun:'mid', last:{water:b(6), feed:b(40), leaf:b(9), repot:b(400), prune:b(200)}}];
  LS.set('kts_petcare_v1', PROF); profBar(); toast('예시 3개(개·고양이·몬스테라)를 넣었습니다'); };
$('#addBtn').onclick = addProf;
$('#runBtn').onclick = run;
$('#icsBtn').onclick = () => { if (!CUR) return; const n = icsFile(`케어일정_${todayS()}.ics`, events()); toast(`캘린더 일정 ${n}개를 .ics 파일로 저장했습니다`); };
$('#copyBtn').onclick = () => CUR && copyOut(`[이번 달 케어]\n` + monthList().map(x => `${korD(x.d)} ${x.who} · ${x.n}${x.due ? ' (지남)' : ''}`).join('\n') + '\n※ 일반 권장 주기이며 아이 상태에 따라 수의사·전문가와 상담하세요.', '이번 달 할 일을 복사했습니다');
$('#printBtn').onclick = () => { if (!CUR) return; const L = monthList(); printDoc(`<div class="paper"><h1>이번 달 케어 할 일</h1><p class="note">${todayS()} 기준 · ${CUR.map(r => r.p.name).join(', ')}</p><table><colgroup><col style="width:22%"><col style="width:20%"><col><col style="width:10%"></colgroup><tr><th>날짜</th><th>대상</th><th>할 일</th><th>완료</th></tr>${L.map(x => `<tr><td>${korD(x.d)}${x.due ? ' (지남)' : ''}</td><td>${esc(x.who)}</td><td>${esc(x.n)}</td><td>□</td></tr>`).join('')}</table><p class="note">일반 권장 주기이며 아이 상태에 따라 수의사·전문가와 상담하세요.</p></div>`); };
showType(); profBar();
</script>
</body></html>
