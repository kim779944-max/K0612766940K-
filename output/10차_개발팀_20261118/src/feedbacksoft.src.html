<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>동료 평가 → 부드러운 피드백 변환기 · KTS 원클릭</title>
<meta name="theme-color" content="#0A1128">
<style>
/*@@CSS@@*/
.tone{background:#0B1530;border:1px solid var(--line);border-radius:11px;padding:10px;margin-top:8px}
.tone .h{display:flex;align-items:center;gap:6px}.tone .h b{flex:1;font-size:13px;color:#fff}
.tone .h button{flex:0 0 auto;font-size:11px;font-weight:800;color:var(--or2);border:1px solid rgba(255,107,0,.45);border-radius:8px;padding:4px 9px}
.st4{margin-top:6px;font-size:12.6px;line-height:1.6;color:#E3E9F2}.st4 span{display:inline-block;min-width:34px;font-size:10.5px;font-weight:900;color:var(--or2)}
.ph{color:var(--yel)}
mark{background:rgba(255,90,90,.25);color:#FFC9C9;border-radius:4px;padding:0 2px}
</style></head>
<body><div id="app">
<!--@@TOP 피드백 부드럽게@@-->
<main>
<section class="hero">
 <h1>거친 평가 메모를<br><em>관찰 → 영향 → 요청 → 격려</em>로</h1>
 <p>사실(무엇을·언제·몇 번)은 그대로 두고, 사람을 탓하는 말을 행동을 말하는 문장으로 바꿉니다. 원문에 없는 칭찬·결론은 만들지 않습니다.</p>
</section>
<section class="card">
 <h2><span class="n">1</span>원문 평가</h2>
 <div class="chips" id="exC"><button id="sampleBtn">예시 1 지각</button><button data-e="1">예시 2 보고 누락</button><button data-e="2">예시 3 응대</button><button data-e="3">예시 4 팀장께</button><button data-e="4">예시 5 마감</button></div>
 <label class="lb">원문 <i>거친 표현 그대로 적으세요 (증거로 보존됩니다)</i></label>
 <textarea id="raw" rows="6" maxlength="3000"></textarea>
 <div class="g2"><div><label class="lb">대상</label><select id="who"><option>동료</option><option>후배</option><option>팀장</option></select></div>
 <div><label class="lb">상황</label><select id="sit"><option>일반</option><option>평가면담</option><option>상황 종료 후</option></select></div></div>
</section>
<button class="btn pri" id="runBtn" style="margin-top:14px">부드럽게 다시 쓰기</button>
<section class="card hide" id="result">
 <h2><span class="n">2</span>다듬은 피드백</h2>
 <div class="row"><button class="btn pri sm" id="copyBtn">보통 톤 복사</button><button class="btn sec sm" id="printBtn">인쇄</button><button class="btn sec sm" id="csvBtn">이력 CSV</button></div>
 <h3>면담 시작 멘트</h3><div class="out" id="open"></div>
 <h3>피해야 할 표현 <span id="banN" class="pill a">0</span></h3><div id="ban"></div>
 <div id="tones"></div>
 <h3>원문 그대로 (증거 보존)</h3><div class="out" id="orig"></div>
 <details class="rule"><summary>바꾸기 사전 (공개)</summary><div id="dict"></div></details>
 <h3>최근 이력 <span class="kv" id="hN"></span></h3><div id="hist"></div>
</section>
<!--@@BOTTOM@@-->
</main></div>
<div id="toast"></div><div id="printArea"></div>
<script>
/*@@JS@@*/
const EXS = [
 ['너는 맨날 지각한다. 이번 달에만 4번 늦었고 지난 화요일엔 25분 늦었다. 그래서 오픈 준비를 내가 혼자 했다. 진짜 성의가 없다. 출근 시간 좀 지켜라.', '동료', '일반'],
 ['보고를 항상 빼먹는다. 11월 거래처 미팅 결과를 3일 뒤에야 공유했다. 그 바람에 견적을 다시 냈다. 생각이 없는 것 같다. 미팅 끝나면 당일에 공유해야 한다. 그래도 자료 정리는 꼼꼼하게 잘한다.', '후배', '평가면담'],
 ['손님한테 말투가 너무 퉁명스럽다. 이번 주 불만 문의가 2건 들어왔다. 절대 그렇게 말하면 안 된다. 인사부터 먼저 했으면 좋겠다.', '동료', '상황 종료 후'],
 ['팀장님은 항상 마감 전날에 일을 바꾼다. 지난주 금요일 오후 6시에 기획안 방향을 바꿔서 주말에 다시 만들었다. 너무 무책임하다. 변경은 최소 이틀 전에 알려 주셨으면 한다.', '팀장', '일반'],
 ['마감을 두 번 넘겼다. 10월 정산표는 5일, 11월 재고표는 3일 늦었다. 회계팀이 결산을 미뤘다. 게으른 거 아니냐. 마감 하루 전에 진행 상황을 알려 줘야 한다. 그래도 고객 응대는 친절해서 고맙다.', '후배', '평가면담']];
const DICT = [
 [/성의가?\s*없(다|는|어|음)?/g, '준비가 부족해 보였습니다'], [/생각이\s*없(는|다|어)?(\s*것\s*같다)?/g, '확인 단계가 빠졌습니다'], [/무책임(하다|한|해)?/g, '책임 범위가 정리되지 않았습니다'],
 [/게으른\s*(거|것)?\s*(아니냐|같다)?/g, '진행이 늦어졌습니다'], [/게으르(다|고)/g, '진행이 늦어졌습니다'], [/한심(하다|해)?/g, '아쉬운 결과였습니다'], [/답답(하다|해)?/g, '진행이 막혔습니다'],
 [/멍청(하다|해)?/g, '실수가 있었습니다'], [/이기적(이다|인)?/g, '협업 공유가 부족했습니다'], [/눈치(가)?\s*없(다|어)?/g, '상황 공유가 부족했습니다'], [/퉁명스럽(다|게)/g, '짧게 들렸습니다'],
 [/(진짜|너무|정말|완전)\s*/g, ''], [/(맨날|항상|매번|늘)\s*/g, ''], [/절대\s*/g, ''], [/(너는|넌|니가|네가)\s*/g, ''], [/(팀장님은)\s*/g, '']];
const BANS = [['너는·넌·니가', /(너는|넌|니가|네가)/g], ['항상·맨날·매번·늘', /(항상|맨날|매번|늘\s)/g], ['절대', /절대/g], ['~같은·~것 같다', /(같은|것\s*같다|거\s*아니냐)/g],
 ['인격 지칭', /(성의가?\s*없|생각이\s*없|무책임|게으르|게으른|한심|답답|멍청|이기적|눈치\s*없|퉁명)/g], ['강조 과장', /(진짜|너무|완전)/g]];
const IMPACT = /(그래서|바람에|때문에|덕분에|결과|손해|불만|미뤘|다시\s*(냈|만들|했)|혼자)/, REQ = /(해야|하라|해라|지켜라|좀\s|했으면|바란|주셨으면|알려\s*줘야|먼저\s*했으면|필요)/, POS = /(잘한|잘하|좋았|고맙|감사|꼼꼼|친절|덕분)/;
function soften(s){ let t = s; DICT.forEach(([r, v]) => t = t.replace(r, v)); return t.replace(/\s{2,}/g, ' ').replace(/^\s*[,.]\s*/, '').trim(); }
function toReq(s, tone){ let t = soften(s).replace(/(을|를)?\s*(지켜라|해라|하라)\.?$/, (m, j) => (j || '') + ' 지켜 주세요').replace(/(해야\s*한다|해야\s*합니다)\.?$/, '해 주세요').replace(/(줘야\s*한다)\.?$/, '주세요').replace(/(했으면\s*좋겠다|했으면\s*한다)\.?$/, '해 주시면 좋겠습니다').replace(/(주셨으면\s*한다)\.?$/, '주시면 좋겠습니다').replace(/\.$/, '');
  if (!/(주세요|좋겠습니다|습니다)$/.test(t)) t += '를 부탁드립니다';
  return tone === 0 ? '혹시 가능하다면, ' + t + '.' : tone === 2 ? '앞으로는 ' + t.replace(/주시면 좋겠습니다$/, '주세요').replace(/부탁드립니다$/, '지켜 주세요') + '. 다음 확인 때 함께 보겠습니다.' : t + '.'; }
const end = (s) => /[.!?]$/.test(s) ? s : s + '.';
let CUR = null;
function run(){
  const raw = $('#raw').value.trim(); if (raw.length < 8){ $('#raw').classList.add('miss'); return toast('원문 평가를 적어 주세요'); } $('#raw').classList.remove('miss');
  const who = $('#who').value, sit = $('#sit').value, S = splitSent(raw);
  const req = S.filter(s => REQ.test(s)), pos = S.filter(s => POS.test(s) && !REQ.test(s)), imp = S.filter(s => IMPACT.test(s) && !req.includes(s) && !pos.includes(s));
  const obs = S.filter(s => !req.includes(s) && !pos.includes(s) && !imp.includes(s));
  const bans = []; BANS.forEach(([k, r]) => { const m = raw.match(r); if (m) bans.push([k, uniq(m.map(x => x.trim()))]); });
  const hon = who === '후배' ? '' : '님';
  const tones = ['부드럽게', '보통', '단호하게'].map((nm, ti) => {
    const pre = ['함께 이야기 나누고 싶은 부분이 있어요. ', '', '분명히 짚고 넘어가야 할 부분이 있습니다. '][ti];
    const O = obs.map(s => end(soften(s))).filter(Boolean), I = imp.map(s => end(soften(s))), Q = req.map(s => toReq(s, ti)), P = pos.map(s => end(soften(s)));
    return {nm, parts:[['관찰', O.length ? pre + O.join(' ') : '[관찰: 언제·무엇을·몇 번 — 원문에 사실이 없어 비워 둡니다]'],
      ['영향', I.length ? (ti === 0 ? '그 일로 ' : '') + I.join(' ') : '[영향: 이 행동으로 생긴 결과를 한 줄 적어 주세요]'],
      ['요청', Q.length ? Q.join(' ') : '[요청: 앞으로 바라는 행동을 한 줄 적어 주세요]'],
      ['격려', P.length ? P.join(' ') + (ti === 2 ? '' : ' 이 점은 계속 이어 가 주세요.') : '[격려: 원문에 장점이 없어 비워 둡니다 — 직접 확인한 장점이 있을 때만 적으세요]']]};
  });
  const open = {일반:`${who}${hon}, 잠깐 5분만 이야기 나눌 수 있을까요? 최근 있었던 일을 함께 정리해 보고 싶어서요.`, 평가면담:`이번 면담은 평가 결론이 아니라, 지난 기간에 있었던 일을 사실대로 같이 확인하는 자리입니다. ${who}${hon} 이야기도 꼭 듣고 싶어요.`, '상황 종료 후':`아까 일은 이제 정리됐으니, 다음에 같은 일이 없도록 차분하게 이야기 나눠 볼까요?`}[sit];
  CUR = {raw, who, sit, bans, tones, open, at:new Date().toISOString().slice(0, 16).replace('T', ' ')};
  const H = LS.get('kts_feedbacksoft_v1', []); H.unshift({at:CUR.at, who, sit, raw, out:toneText(1)}); LS.set('kts_feedbacksoft_v1', H.slice(0, 20));
  render();
}
function toneText(i){ return CUR.tones[i].parts.map(p => `[${p[0]}] ${p[1]}`).join('\n'); }
function render(){
  const R = CUR; $('#open').textContent = R.open; $('#banN').textContent = R.bans.reduce((a, b) => a + b[1].length, 0);
  $('#ban').innerHTML = R.bans.length ? R.bans.map(([k, v]) => `<div class="item warn"><div class="q">${esc(k)}</div><div class="a">${v.map(x => `<mark>${esc(x)}</mark>`).join(' ')}</div></div>`).join('') : '<p class="empty">피해야 할 표현이 없습니다</p>';
  $('#tones').innerHTML = R.tones.map((t, i) => `<div class="tone"><div class="h"><b>${i + 1}. ${t.nm}</b><button data-t="${i}">복사</button></div>${t.parts.map(p => `<div class="st4"><span>${p[0]}</span>${/^\[/.test(p[1]) ? `<span class="ph">${esc(p[1])}</span>` : esc(p[1])}</div>`).join('')}</div>`).join('');
  $$('[data-t]').forEach(b => b.onclick = () => copyOut(toneText(+b.dataset.t), CUR.tones[+b.dataset.t].nm + ' 톤을 복사했습니다'));
  let o = esc(R.raw); BANS.forEach(([k, r]) => o = o.replace(new RegExp(r.source, 'g'), m => `<mark>${m}</mark>`)); $('#orig').innerHTML = o;
  $('#dict').innerHTML = `<table class="t"><tr><th>원문 표현</th><th>바꾼 표현</th></tr>${DICT.map(([r, v]) => `<tr><td>${esc(r.source.replace(/\\s\*|\(|\)|\?|\|/g, m => m === '|' ? ' · ' : ''))}</td><td>${v ? esc(v) : '(지움)'}</td></tr>`).join('')}</table>`;
  const H = LS.get('kts_feedbacksoft_v1', []); $('#hN').textContent = `${H.length}/20건 · 이 기기 저장`;
  $('#hist').innerHTML = H.slice(0, 5).map(h => `<div class="item"><div class="q">${esc(h.at)} · ${esc(h.who)} · ${esc(h.sit)}</div><div class="a">${esc(h.raw.slice(0, 60))}…</div></div>`).join('');
  $('#result').classList.remove('hide'); $('#result').scrollIntoView({block:'start'}); window.scrollBy(0, -60);
}
function setEx(i){ $('#raw').value = EXS[i][0]; $('#who').value = EXS[i][1]; $('#sit').value = EXS[i][2]; toast(`예시 ${i + 1}을 넣었습니다`); }
$('#sampleBtn').onclick = () => setEx(0); $$('#exC [data-e]').forEach(b => b.onclick = () => setEx(+b.dataset.e));
$('#runBtn').onclick = run;
$('#copyBtn').onclick = () => CUR && copyOut(CUR.open + '\n\n' + toneText(1), '보통 톤을 복사했습니다');
$('#csvBtn').onclick = () => saveCSV(`피드백이력_${todayS()}.csv`, [['일시','대상','상황','원문','다듬은 문장(보통)']].concat(LS.get('kts_feedbacksoft_v1', []).map(h => [h.at, h.who, h.sit, h.raw, h.out])));
$('#printBtn').onclick = () => { if (!CUR) return; printDoc(`<div class="paper"><h1>피드백 면담 메모</h1><p class="note">${CUR.at} · 대상 ${esc(CUR.who)} · ${esc(CUR.sit)}</p><h2>시작 멘트</h2><p>${esc(CUR.open)}</p>${CUR.tones.map(t => `<h2>${t.nm}</h2><table>${t.parts.map(p => `<tr><th style="width:14%">${p[0]}</th><td>${esc(p[1])}</td></tr>`).join('')}</table>`).join('')}<h2>원문 (증거 보존)</h2><p class="pre">${esc(CUR.raw)}</p><p class="note">사실은 원문 그대로 두고 표현만 바꾸었습니다. 원문에 없는 칭찬·결론은 만들지 않았습니다.</p></div>`); };
</script>
</body></html>
