<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KTS 더런처 — 원클릭 100선 통합 런처 · KTS 원클릭</title>
<meta name="theme-color" content="#0A1128">
<style>
/*@@CSS@@*/
.sr{display:flex;gap:7px;margin-top:10px}.sr input{flex:1;font-size:15px;padding:12px}.sr button{flex:0 0 74px}
.pc{display:flex;gap:9px;align-items:center;background:#0B1530;border:1px solid var(--line);border-radius:12px;padding:8px;margin-top:7px;text-decoration:none;color:inherit}
.pc img{flex:0 0 42px;width:42px;height:42px;border-radius:10px;background:#16223F;object-fit:cover}
.pc .m{flex:1;min-width:0}.pc .m b{display:block;font-size:13px;color:#fff;line-height:1.35}.pc .m span{display:block;font-size:11.5px;color:var(--sub);line-height:1.4}
.pc .fav{flex:0 0 38px;width:38px;height:38px;border-radius:10px;border:1px solid var(--line2);background:var(--card2);font-size:17px;color:var(--sub)}
.pc .fav.on{color:var(--or);border-color:var(--or)}
.pc.soon{opacity:.55}.pc.soon .m b::after{content:" · 준비 중";color:var(--yel);font-size:11px}
.ind{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:8px}
.ind button{font-size:11.5px;font-weight:800;color:#DCE6F2;border:1px solid var(--line2);border-radius:10px;padding:9px 2px;background:var(--card2);min-width:0;word-break:keep-all}
.ind button.on{background:var(--or);border-color:var(--or);color:var(--on)}
.tabs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.tabs button{font-size:12px;font-weight:800;color:#DCE6F2;border:1px solid var(--line2);border-radius:999px;padding:6px 10px;background:var(--card2)}
.tabs button.on{background:var(--or);border-color:var(--or);color:var(--on)}
</style></head>
<body><div id="app">
<!--@@TOP KTS 더런처@@-->
<main>
<section class="hero">
 <h1>원클릭 도구를<br><em>한 칸 검색</em>으로 바로 열기</h1>
 <p>상품명·태그·상황어("월세", "폐업", "영수증")로 바로 찾고, 최근 쓴 5개와 별표 즐겨찾기, 업종별 추천을 한 화면에서 엽니다. 목록은 쇼룸 상품 목록(products.js)을 그대로 읽어 새 상품이 자동으로 나타납니다.</p>
</section>
<section class="card" id="in">
 <h2><span class="n">1</span>찾기</h2>
 <div class="sr"><input id="q" type="search" placeholder="예: 월세, 세금, 리뷰, 영수증" maxlength="40" aria-label="검색어"><button class="btn pri sm" id="runBtn">찾기</button></div>
 <div class="chips" id="chips"><button id="sampleBtn" data-q="월세">월세</button><button data-q="세금">세금</button><button data-q="폐업">폐업</button><button data-q="영수증">영수증</button><button data-q="리뷰">리뷰</button><button data-q="공문">공문</button></div>
</section>
<section class="card" id="result">
 <h2><span class="n">2</span><span id="rTitle">전체</span></h2>
 <div class="row"><button class="btn sec sm" id="copyBtn">목록 복사</button><button class="btn sec sm" id="csvBtn">목록 CSV</button><button class="btn sec sm" id="resetBtn">검색 지우기</button></div>
 <div id="res"></div>
</section>
<section class="card" id="recentC"><h2><span class="n">R</span>최근 사용 5개</h2><div id="recent"></div></section>
<section class="card" id="favC"><h2><span class="n">★</span>즐겨찾기</h2><div id="fav"></div></section>
<section class="card"><h2><span class="n">3</span>업종별 추천</h2><div class="ind" id="ind"></div><div id="indList"></div></section>
<section class="card"><h2><span class="n">4</span>전체 목록 <span class="kv" id="cnt" style="font-weight:700"></span></h2><div class="tabs" id="tabs"></div><div id="all"></div></section>
<!--@@BOTTOM@@-->
</main></div>
<div id="toast"></div><div id="printArea"></div>
<script src="products.js"></script>
<script>
/*@@JS@@*/
const SELF = 'launcher', RK = 'kts_launcher_recent_v1', FK = 'kts_launcher_fav_v1';
const CATS = [['all', '전체'], ['convert', '변환·문서'], ['money', '자금·세무'], ['talk', '대화'], ['auto', '업무 자동화'], ['etc', '생활'], ['soon', '준비 중']];
const IND = [['부동산', /부동산|매물|임대|임차|등기|시세|교환|상가|임장|중개|전세|월세|분양|토지|아파트|건물/g], ['매장·카페', /매장|카페|메뉴|스탬프|사장님|가게|손님|음식점|배달|폐업|단골|발주|위생|알바|직원/g], ['사무·회계', /장부|세금|급여|견적|계산서|공문|업무|일지|PDF|문서|정산|회계|영수증|명세|계약서|대장/g], ['마케팅', /마케팅|광고|리뷰|태그|검색어|SNS|인스타|블로그|해시태그|판매글|홍보|키워드|트렌드|쇼핑몰|셀러/g], ['생활', /여행|식단|가계부|생활|운동|반려|영어|이사|구독|일정|중고|건강|학습/g]];
const SYN = {월세:['임대', '임차'], 영수증:['증빙'], 폐업:['정리', '양도'], 세금:['세무', '부가세', '세율'], 번역:['영문', '한↔영'], 중고:['당근', '판매글'], 리뷰:['후기']};
let Q = '', CAT = 'all', INDI = 0;
const P = () => (window.PRODUCTS || []).filter(p => p.k !== SELF);
const hay = p => [p.k, p.nm, p.sub, p.line, p.blurb].concat((p.bullets || []).flat(), p.how || [], p.notes || []).join(' ').toLowerCase();
const live = p => p.status === 'live';
function match(p, q){ const h = hay(p); return q.toLowerCase().split(/\s+/).filter(Boolean).every(t => [t].concat(SYN[t] || []).some(x => h.includes(x.toLowerCase()))); }
/* 관련도: 이름·부제에 있으면 3점, 한 줄 소개 2점, 그 밖 설명 1점 (동의어는 절반) */
function rel(p, q){ const A = [p.k, p.nm, p.sub].join(' ').toLowerCase(), B = String(p.line || '').toLowerCase(), C = hay(p);
  return q.toLowerCase().split(/\s+/).filter(Boolean).reduce((s, t) => s + [[t, 1]].concat((SYN[t] || []).map(x => [x.toLowerCase(), .5])).reduce((m, [x, w]) => Math.max(m, w * (A.includes(x) ? 3 : B.includes(x) ? 2 : C.includes(x) ? 1 : 0)), 0), 0); }
const favs = () => LS.get(FK, []), recents = () => LS.get(RK, []);
function card(p){ const f = favs().includes(p.k); const tag = live(p) ? 'a' : 'div';
  return `<${tag} class="pc${live(p) ? '' : ' soon'}" ${live(p) ? `href="${esc(p.link)}" data-go="${esc(p.k)}"` : ''}><img src="${esc(p.icon || '')}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"><div class="m"><b>${esc(p.nm)}</b><span>${esc(p.line || p.sub || '')}</span></div><button class="fav${f ? ' on' : ''}" data-f="${esc(p.k)}" aria-label="즐겨찾기">${f ? '★' : '☆'}</button></${tag}>`; }
function bind(root){
  root.querySelectorAll('[data-go]').forEach(a => a.addEventListener('click', () => { const r = recents().filter(k => k !== a.dataset.go); r.unshift(a.dataset.go); LS.set(RK, r.slice(0, 5)); setTimeout(render, 0); }));
  root.querySelectorAll('[data-f]').forEach(b => b.onclick = e => { e.preventDefault(); e.stopPropagation(); const F = favs(), k = b.dataset.f; const i = F.indexOf(k); if (i >= 0) F.splice(i, 1); else F.push(k); LS.set(FK, F); render(); toast(i >= 0 ? '즐겨찾기에서 뺐습니다' : '즐겨찾기에 넣었습니다'); });
}
function render(){
  const all = P(), byK = Object.fromEntries(all.map(p => [p.k, p]));
  const R = Q ? all.filter(p => match(p, Q)).map(p => ({p, s:rel(p, Q)})).sort((a, b) => (live(b.p) - live(a.p)) || (b.s - a.s)).map(x => x.p) : all.filter(live).slice(-8).reverse();
  window.__res = R;
  $('#rTitle').textContent = Q ? `"${Q}" 찾은 결과 ${R.length}개` : `새로 들어온 도구 ${R.length}개`;
  $('#res').innerHTML = R.length ? R.map(card).join('') : '<p class="empty">찾는 도구가 없습니다. 다른 말로 찾아보세요.</p>';
  const rc = recents().map(k => byK[k]).filter(Boolean); $('#recent').innerHTML = rc.length ? rc.map(card).join('') : '<p class="empty">아직 연 도구가 없습니다</p>';
  const fv = favs().map(k => byK[k]).filter(Boolean); $('#fav').innerHTML = fv.length ? fv.map(card).join('') : '<p class="empty">☆을 누르면 여기에 모입니다</p>';
  $('#ind').innerHTML = IND.map(([n], i) => `<button data-i="${i}" class="${i === INDI ? 'on' : ''}">${n}</button>`).join('');
  $$('#ind button').forEach(b => b.onclick = () => { INDI = +b.dataset.i; render(); });
  const re = IND[INDI][1]; const sc = all.filter(live).map(p => ({p, s:([p.nm, p.sub, p.line, p.blurb].join(' ').match(re) || []).length})).filter(x => x.s).sort((a, b) => b.s - a.s).slice(0, 8);
  $('#indList').innerHTML = sc.map(x => card(x.p)).join('') || '<p class="empty">없음</p>';
  $('#tabs').innerHTML = CATS.map(([c, n]) => `<button data-c="${c}" class="${c === CAT ? 'on' : ''}">${n} ${c === 'all' ? all.length : c === 'soon' ? all.filter(p => !live(p)).length : all.filter(p => p.cat === c && live(p)).length}</button>`).join('');
  $$('#tabs button').forEach(b => b.onclick = () => { CAT = b.dataset.c; render(); });
  const L = all.filter(p => CAT === 'all' ? true : CAT === 'soon' ? !live(p) : p.cat === CAT && live(p));
  $('#cnt').textContent = `· 열림 ${all.filter(live).length} · 준비 중 ${all.filter(p => !live(p)).length}`;
  $('#all').innerHTML = L.map(card).join('');
  [$('#res'), $('#recent'), $('#fav'), $('#indList'), $('#all')].forEach(bind);
}
window.addEventListener('pageshow', () => render());
$('#runBtn').onclick = () => { Q = $('#q').value.trim(); render(); };
$('#q').addEventListener('input', () => { Q = $('#q').value.trim(); render(); });
$$('#chips button').forEach(b => b.onclick = () => { $('#q').value = b.dataset.q; Q = b.dataset.q; render(); });
$('#resetBtn').onclick = () => { $('#q').value = ''; Q = ''; render(); };
$('#copyBtn').onclick = () => copyOut((window.__res || []).map((p, i) => `${i + 1}. ${p.nm} — ${p.link}`).join('\n'), '목록을 복사했습니다');
$('#csvBtn').onclick = () => saveCSV(`원클릭목록_${todayS()}.csv`, [['키','이름','분류','상태','주소']].concat(P().map(p => [p.k, p.nm, (CATS.find(c => c[0] === p.cat) || [0, p.cat])[1], live(p) ? '열림' : '준비 중', p.link])));
render();
</script>
</body></html>
