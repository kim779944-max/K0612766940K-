<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KTS 더제출 — 관공서·은행 제출서류 점검표 · KTS 원클릭</title>
<meta name="theme-color" content="#0A1128">
<style>
/*@@CSS@@*/
.sit{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
.sit button{border:1px solid var(--line2);border-radius:12px;padding:11px 8px;background:var(--card2);text-align:left;line-height:1.3}
.sit button b{display:block;font-size:13.5px;color:#fff}
.sit button span{display:block;font-size:10.5px;color:var(--sub);margin-top:2px}
.sit button.on{border-color:var(--or);background:rgba(255,107,0,.14)}
.doc{display:flex;gap:9px;align-items:flex-start}
.doc .bd{flex:1;min-width:0}
.doc .bd b{display:block;font-size:13px;color:#fff}
.doc .bd span{display:block;font-size:11px;color:var(--sub);margin-top:2px;line-height:1.5}
.doc.done .bd b{color:var(--sub);text-decoration:line-through}
.prog2{height:7px;border-radius:7px;background:#22335A;overflow:hidden;margin-top:8px}.prog2 i{display:block;height:100%;background:linear-gradient(90deg,var(--or),var(--or2));transition:width .2s}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.links a{font-size:11.5px;font-weight:800;border:1px solid var(--line2);border-radius:999px;padding:5px 10px;text-decoration:none;color:#DCE6F2;background:var(--card2)}
</style></head>
<body><div id="app">
<!--@@TOP KTS 더제출 · 제출서류 점검표@@-->
<main>
<section class="hero">
 <h1>상황만 고르면<br><em>챙길 서류와 순서</em>가 한 장에</h1>
 <p>필요 서류 · 발급처 · 소요시간 · 수수료 · 빠뜨리기 쉬운 서류 · 진행 순서 · 오늘 준비물 1장 인쇄. 체크한 상태는 이 기기에 저장됩니다.</p>
 <div class="fixnote">서류 목록은 일반 안내입니다. 기관·지점·업종·개인 사정에 따라 요구 서류와 수수료가 다를 수 있으니 제출 전 해당 기관에 꼭 확인하세요.</div>
</section>

<section class="card">
 <h2><span class="n">1</span>상황 고르기</h2>
 <div class="sit" id="sit"></div>
</section>

<section class="card hide" id="result">
 <h2><span class="n">2</span><span id="sitName"></span> 체크리스트</h2>
 <div class="prog2"><i id="bar"></i></div>
 <p class="kv" id="progTxt"></p>
 <div class="row"><button class="btn pri sm" id="printBtn">오늘 준비물 1장 인쇄</button><button class="btn sec sm" id="copyBtn">목록 복사</button><button class="btn sec sm" id="resetBtn">체크 초기화</button></div>
 <div id="docs"></div>
 <h3>빠뜨리기 쉬운 서류 3개</h3><div id="miss"></div>
 <h3>진행 순서</h3><table class="t" id="order"></table>
 <h3>공식 사이트</h3><div class="links" id="links"></div>
</section>
<!--@@BOTTOM@@-->
</main></div>
<div id="toast"></div><div id="printArea"></div>
<script>
/*@@JS@@*/
const L = {gov:['정부24', 'https://www.gov.kr'], ht:['홈택스', 'https://www.hometax.go.kr'], iros:['인터넷등기소', 'https://www.iros.go.kr'], sb:['온라인법인설립시스템', 'https://www.startbiz.go.kr'],
  wetax:['위택스', 'https://www.wetax.go.kr'], semas:['소상공인시장진흥공단', 'https://www.semas.or.kr'], nhis:['국민건강보험', 'https://www.nhis.or.kr'], rtms:['부동산거래관리시스템', 'https://rtms.molit.go.kr'], fourins:['4대사회보험 정보연계센터', 'https://www.4insure.or.kr']};
const S = {
 biz:{nm:'사업자 등록', d:'개인사업자 처음 시작', links:['ht', 'gov'],
  docs:[['사업자등록 신청서','홈택스 또는 관할 세무서','신청 후 보통 3일 안팎(현장 확인 시 더 걸림)','무료'],['대표자 신분증','본인 지참','바로','—'],['사업장 임대차계약서 사본','임대인과 작성한 계약서','바로','—'],
   ['인허가·신고증 사본 (해당 업종만)','구청 위생과 등 업종별 담당 기관','업종마다 다름','업종마다 다름'],['동업계약서 (공동사업일 때)','동업자와 작성','바로','—'],['자금출처명세서 (일부 업종)','홈택스 서식','바로','무료']],
  miss:['영업신고증 같은 인허가 서류는 사업자 등록보다 먼저 받아야 하는 업종이 많습니다','임대차계약서의 임차인 이름이 대표자와 같아야 합니다','간이과세·일반과세 선택을 미리 정해 두세요'],
  order:['업종 인허가 필요 여부 확인','사업장 임대차 계약','인허가·영업신고 (해당 업종)','홈택스 사업자등록 신청','사업용 계좌·카드 등록']},
 corp:{nm:'법인 설립', d:'주식회사 새로 만들기', links:['sb', 'iros', 'wetax', 'ht'],
  docs:[['정관','발기인 작성 (공증은 자본금 등 조건에 따라)','1~2일','조건에 따라 공증료'],['발기인 회의록·이사회 의사록','발기인 작성','바로','—'],['주식인수증·주금납입 증명 (잔고증명서)','은행','당일','은행마다 다름'],
   ['임원 취임승낙서','임원 작성','바로','—'],['임원 인감증명서·주민등록초본','주민센터 / 정부24','당일','건당 수백 원'],['법인 인감 신고서','등기소 (온라인 설립 시 함께)','등기와 함께','—'],
   ['등록면허세 납부 영수증','위택스 / 구청','당일','자본금 기준 (과밀억제권역은 중과)'],['법인 설립등기 신청서','온라인법인설립시스템 / 등기소','보통 수일','등기 수수료 별도']],
  miss:['과밀억제권역(서울 등) 설립은 등록면허세가 무거워질 수 있습니다','임원 인감증명서는 발급 3개월 이내만 받는 곳이 많습니다','등기 뒤 법인 사업자등록을 따로 신청해야 합니다'],
  order:['상호·목적·자본금·임원 정하기','정관·의사록 작성','자본금 납입·잔고증명','등록면허세 납부','설립등기 신청','법인 인감·사업자등록']},
 lease:{nm:'임대차 계약', d:'전·월세 집 구할 때', links:['iros', 'gov', 'rtms'],
  docs:[['등기사항전부증명서(등기부등본)','인터넷등기소','바로','열람 700원 · 발급 1,000원 안팎'],['건축물대장','정부24','바로','온라인 무료'],['임대인 신분증 확인','계약 자리에서 확인','바로','—'],
   ['임대차계약서','중개사무소 / 직접 작성','계약일','—'],['전입신고','주민센터 / 정부24','바로','무료'],['확정일자','주민센터 / 인터넷등기소','바로','수백 원'],
   ['주택임대차 신고 (대상일 때)','주민센터 / 부동산거래관리시스템','계약 후 30일 이내','무료'],['임대인 국세·지방세 완납 확인 (동의 받아)','임대인 발급 / 열람 신청','당일','무료']],
  miss:['계약 당일에도 등기부등본을 다시 떼어 근저당·소유자를 확인하세요','전입신고와 확정일자는 이사 당일 함께 하세요','보증금 일정 금액 초과 등 대상이면 임대차 신고 기한(30일)을 넘기지 마세요'],
  order:['등기부등본·건축물대장 확인','임대인 신분 확인','계약서 작성·계약금','잔금·입주','전입신고·확정일자','임대차 신고(대상 시)']},
 loan:{nm:'대출 신청', d:'정책자금·은행 사업자 대출', links:['ht', 'gov', 'semas', 'wetax'],
  docs:[['사업자등록증명','홈택스 / 세무서','바로','무료'],['부가가치세 과세표준증명','홈택스','바로','무료'],['소득금액증명 (개인)','홈택스','바로','무료'],
   ['재무제표 증명 (법인)','홈택스','바로','무료'],['국세 납세증명서','홈택스 / 정부24','바로','무료'],['지방세 납세증명서','정부24 / 위택스','바로','무료'],
   ['4대보험 완납증명 (직원 있을 때)','국민건강보험 등','바로','무료'],['주민등록등본·신분증','정부24','바로','온라인 무료'],['사업장 임대차계약서 사본','본인 보관본','바로','—'],['사업계획서 (정책자금)','신청 기관 서식','작성 기간','—']],
  miss:['체납이 있으면 납세증명서가 안 나오니 먼저 확인하세요','부가세 신고 기간이 지나야 최신 매출이 증명에 나옵니다','정책자금은 업력·업종 제한이 있어 공고문 자격 요건부터 보세요'],
  order:['자격 요건(업력·업종·신용) 확인','홈택스 증명서 한 번에 발급','납세·4대보험 완납 확인','사업계획서 작성','신청·상담 예약','심사·약정']},
 close:{nm:'폐업 신고', d:'가게 문 닫을 때', links:['ht', 'gov', 'fourins'],
  docs:[['폐업신고서','홈택스 / 세무서','바로','무료'],['인허가 폐업 신고 (해당 업종)','구청 등 인허가 기관','바로','무료'],['부가가치세 폐업 확정신고','홈택스','폐업일이 속한 달 말일부터 25일 이내','무료'],
   ['사업장 4대보험 탈퇴 신고 (직원 있을 때)','4대사회보험 정보연계센터','다음 달 15일까지','무료'],['직원 퇴직 정산 자료','사업주 작성','폐업 전','—'],['카드 단말기·배달앱 해지','각 업체','업체마다 다름','위약금 확인']],
  miss:['인허가(영업신고) 폐업을 따로 안 하면 면허세가 계속 나올 수 있습니다','부가세 폐업 신고 기한을 넘기면 가산세가 붙습니다','다음 해 5월 종합소득세 신고는 폐업해도 해야 합니다'],
  order:['직원 정산·4대보험 상실','인허가 폐업 신고','세무서 폐업 신고','부가세 확정신고','단말기·계약 해지','다음 해 5월 종합소득세']}
};
const LSK = 'kts_docs_check_v1';
let ST = LS.get(LSK, {}), CURK = '';
$('#sit').innerHTML = Object.entries(S).map(([k, v], i) => `<button data-k="${k}"${i === 0 ? ' id="sampleBtn"' : ''}><b>${v.nm}</b><span>${v.d}</span></button>`).join('');
const chk = k => ST[k] || (ST[k] = []);
function render(){
  const v = S[CURK], c = chk(CURK);
  $$('#sit button').forEach(b => b.classList.toggle('on', b.dataset.k === CURK));
  $('#sitName').textContent = v.nm;
  $('#docs').innerHTML = v.docs.map(([n, w, t, f], i) => `<label class="item doc${c[i] ? ' done' : ''}"><input type="checkbox" data-i="${i}"${c[i] ? ' checked' : ''}><div class="bd"><b>${esc(n)}</b><span>발급처: ${esc(w)}<br>소요: ${esc(t)} · 수수료: ${esc(f)}</span></div></label>`).join('');
  const n = v.docs.filter((x, i) => c[i]).length;
  $('#bar').style.width = (n / v.docs.length * 100) + '%'; $('#progTxt').textContent = `${v.docs.length}개 중 ${n}개 준비 완료 · 남은 ${v.docs.length - n}개`;
  $('#miss').innerHTML = v.miss.map((m, i) => `<div class="item warn"><div class="a"><b style="color:var(--or2)">${i + 1}.</b> ${esc(m)}</div></div>`).join('');
  $('#order').innerHTML = '<colgroup><col style="width:14%"><col></colgroup>' + v.order.map((o, i) => `<tr><td><b>${i + 1}</b></td><td>${esc(o)}</td></tr>`).join('');
  $('#links').innerHTML = v.links.map(k => `<a href="${L[k][1]}" target="_blank" rel="noopener">${L[k][0]}</a>`).join('');
}
$('#sit').onclick = e => { const b = e.target.closest('button'); if (!b) return; CURK = b.dataset.k; render(); $('#result').classList.remove('hide'); $('#result').scrollIntoView({block:'start'}); window.scrollBy(0, -60); };
$('#docs').onchange = e => { const i = +e.target.dataset.i; chk(CURK)[i] = e.target.checked; LS.set(LSK, ST); render(); };
$('#resetBtn').onclick = () => { ST[CURK] = []; LS.set(LSK, ST); render(); toast('체크를 초기화했습니다'); };
const listText = () => { const v = S[CURK], c = chk(CURK); return `[${v.nm} 제출서류 점검표 ${todayS()}]\n` + v.docs.map(([n, w, t, f], i) => `${c[i] ? '■' : '□'} ${n} — ${w} (${t} / ${f})`).join('\n') + '\n\n빠뜨리기 쉬운 것\n' + v.miss.map((m, i) => `${i + 1}. ${m}`).join('\n') + '\n\n※ 일반 안내이며 기관별로 다를 수 있습니다.'; };
$('#copyBtn').onclick = () => CURK && copyOut(listText(), '목록을 복사했습니다');
$('#printBtn').onclick = () => { if (!CURK) return; const v = S[CURK], c = chk(CURK); const left = v.docs.filter((x, i) => !c[i]).length;
  printDoc(`<div class="paper"><h1>오늘 준비물 · ${v.nm}</h1><p class="note">${todayS()} · ${v.docs.length}개 중 남은 ${left}개 · 서류 목록은 일반 안내이며 기관별로 다를 수 있습니다</p>
  <table><colgroup><col style="width:7%"><col style="width:33%"><col style="width:25%"><col style="width:17%"><col></colgroup><tr><th>준비</th><th>서류</th><th>발급처</th><th>소요</th><th>수수료</th></tr>${v.docs.map(([n, w, t, f], i) => `<tr><td style="text-align:center">${c[i] ? '■' : '□'}</td><td>${esc(n)}</td><td>${esc(w)}</td><td>${esc(t)}</td><td>${esc(f)}</td></tr>`).join('')}</table>
  <h2>빠뜨리기 쉬운 서류</h2><ol>${v.miss.map(m => `<li>${esc(m)}</li>`).join('')}</ol>
  <h2>진행 순서</h2><p>${v.order.map((o, i) => `${i + 1}. ${esc(o)}`).join(' → ')}</p>
  <p class="note">공식 사이트: ${v.links.map(k => `${L[k][0]} ${L[k][1]}`).join(' · ')}</p></div>`); };
</script>
</body></html>
