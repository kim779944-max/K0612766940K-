# ⚠️ 이 파일은 아직 워크플로가 아니라 '보관본'입니다.
#    GitHub 앱 권한에 `workflows` 권한이 없어 자동 푸시가 막혀, 여기(ci/)에 둡니다.
#    PC 없이 클라우드에서 APK를 뽑으려면 딱 한 번만 옮겨 주세요:
#    ① GitHub 웹에서 이 파일 내용을 복사 → `Add file > Create new file`
#    ② 파일 이름: .github/workflows/apk-saycap.yml  → 내용 붙여넣기 → Commit
#    (또는 Pickle GitHub 앱 설치에 Workflows 권한을 추가해 주시면 제가 직접 넣겠습니다.)
#
# 이 워크플로가 하는 일: GitHub 서버에서 세이캡 APK를 빌드해
#   - Actions 실행 기록에 산출물(saycap-apk)로 올리고
#   - 빌드 결과(CLAUDE_RESULT_APK_20261117.md)와 버전 변경만 저장소에 커밋합니다.
# 상품 APK 자체는 공개 저장소에 커밋하지 않습니다(공개 배포 방지).
name: APK build — 세이캡

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode (기본 14)"
        required: false
        default: "14"
      version_name:
        description: "versionName (기본 1.4)"
        required: false
        default: "1.4"
  push:
    paths:
      - "app_saycap/**"
      - ".github/workflows/apk-saycap.yml"
      - ".github/scripts/build_saycap_apk.sh"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VC: ${{ github.event.inputs.version_code || '14' }}
      VN: ${{ github.event.inputs.version_name || '1.4' }}

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK 패키지 설치
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: APK 빌드 (versionCode/versionName만 변경)
        run: bash .github/scripts/build_saycap_apk.sh

      - name: 산출물 보관 (Actions 실행 화면에서 내려받기)
        uses: actions/upload-artifact@v4
        with:
          name: saycap-apk
          path: output/apk_20261117/*.apk
          if-no-files-found: error

      - name: 버전 변경·결과 문서만 커밋 (상품 APK는 커밋하지 않음)
        run: |
          set -euo pipefail
          git config user.name "kts-apk-bot"
          git config user.email "kts-apk-bot@users.noreply.github.com"
          git add app_saycap/AndroidManifest.xml CLAUDE_RESULT_APK_20261117.md
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "build: 세이캡 v${VN} debug APK (GitHub Actions 자동 빌드)"
            git push
          fi
