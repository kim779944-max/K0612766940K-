<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>여행 코스 플래너 · KTS 원클릭</title>
<meta name="theme-color" content="#0A1128">
<style>
/*@@CSS@@*/
.day{background:#0B1530;border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:9px}
.day h4{font-size:13.5px;color:#fff;font-weight:900}
.slot{display:grid;grid-template-columns:44px 1fr;gap:6px;padding:6px 0;border-top:1px solid var(--line);font-size:12.5px}
.slot:first-of-type{border-top:0}
.slot .t{color:var(--or2);font-weight:900;font-size:11.5px}
.slot .p{color:#E3E9F2;min-width:0;overflow-wrap:anywhere}
.slot .p small{display:block;color:var(--sub);font-size:10.5px}
.slot .p.blank{color:var(--sub);font-style:italic}
.ck{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 0}
</style></head>
<body><div id="app">
<!--@@TOP 여행 코스 플래너@@-->
<main>
<section class="hero">
 <h1>도시·기간·예산을 넣으면<br><em>일자별 코스표</em>와 준비물</h1>
 <p>장소는 내가 적은 목록(또는 내장 예시)에서만 고릅니다. 영업시간·가격을 조회하지 않으며, 이동시간·비용은 모두 "추정"으로 표시합니다.</p>
</section>
<section class="card">
 <h2><span class="n">1</span>여행 조건</h2>
 <div class="row"><button class="btn sec sm" id="sampleBtn">예시: 하남 → 강릉 2박 3일</button></div>
 <div class="g2"><div><label class="lb">출발지</label><input id="from" maxlength="20"></div><div><label class="lb">도시</label><input id="city" maxlength="20"></div></div>
 <div class="g2"><div><label class="lb">기간</label><select id="nights"><option value="0">당일</option><option value="1">1박 2일</option><option value="2" selected>2박 3일</option><option value="3">3박 4일</option><option value="4">4박 5일</option></select></div><div><label class="lb">출발일</label><input id="start" type="date"></div></div>
 <div class="g2"><div><label class="lb">총예산(원)</label><input id="budget" inputmode="numeric" maxlength="12"></div><div><label class="lb">인원</label><input id="pax" type="number" min="1" max="20" value="2"></div></div>
 <label class="lb">동행</label><div class="chips" id="who"><button data-k="solo">혼자</button><button data-k="family" class="on">가족</button><button data-k="parents">부모님</button></div>
 <label class="lb">이동 수단 · 편도 거리 <i>모르면 비워 두세요(이동시간 표시 안 함)</i></label>
 <div class="g2"><select id="mode"><option value="car">자가용</option><option value="train">기차</option><option value="bus">고속버스</option></select><input id="km" inputmode="numeric" placeholder="편도 km" maxlength="5"></div>
 <label class="lb">가고 싶은 곳 <i>한 줄에 하나 · "장소 | 관광/식사/카페/체험"</i></label>
 <textarea id="places" rows="7" maxlength="4000"></textarea>
</section>
<button class="btn pri" id="runBtn" style="margin-top:14px">코스 짜기</button>
<section class="card hide" id="result">
 <h2><span class="n">2</span><span id="rTitle">여행 코스</span></h2>
 <div class="stat"><div><b id="sDays">0</b><span>일정</span></div><div><b id="sSlots">0</b><span>채운 칸</span></div><div><b id="sBlank">0</b><span>장소 입력 칸</span></div></div>
 <div class="row"><button class="btn pri sm" id="printBtn">인쇄</button><button class="btn sec sm" id="copyBtn">코스 복사</button></div>
 <p class="kv" id="moveInfo"></p>
 <div id="days"></div>
 <h3>예산 배분 (추정)</h3><div id="budgetT"></div>
 <h3>준비물 체크리스트</h3><div id="kit"></div>
 <p class="fixnote">장소·영업시간·요금은 조회하지 않았습니다. 방문 전 공식 안내에서 확인하세요. 금액은 입력 예산을 비율로 나눈 추정치입니다.</p>
</section>
<!--@@BOTTOM@@-->
</main></div>
<div id="toast"></div><div id="printArea"></div>
<script>
/*@@JS@@*/
const SAMPLE_PLACES = `경포해변 | 관광
경포호 산책로 | 관광
오죽헌 | 관광
안목해변 커피거리 | 카페
강릉중앙시장 | 식사
초당순두부마을 | 식사
주문진 수산시장 | 식사
정동진 | 관광
선교장 | 관광
강문해변 | 관광`;
const SPEED = {car:70, train:90, bus:65}, MODE_N = {car:'자가용', train:'기차', bus:'고속버스'};
const RATIO = {solo:{교통:.30, 숙박:.35, 식비:.25, '입장·체험':.05, 예비:.05}, family:{교통:.20, 숙박:.40, 식비:.28, '입장·체험':.07, 예비:.05}, parents:{교통:.20, 숙박:.42, 식비:.25, '입장·체험':.05, 예비:.08}};
const KIT = {base:['신분증','휴대폰 충전기·보조배터리','상비약(두통·소화·밴드)','세면도구','갈아입을 옷'],
  solo:['이어폰','가벼운 가방'], family:['아이 간식·물티슈','아이 여벌 옷','보조 의자/유모차(필요 시)'], parents:['복용 중인 약','편한 신발','무릎담요','돋보기·안경'],
  beach:['수건','선크림','모자','여벌 신발'], cold:['핫팩','두꺼운 외투','장갑'], hot:['양산','휴대 선풍기'], car:['내비 목적지 저장','하이패스 카드'], train:['승차권 캡처'], bus:['승차권 캡처','목베개']};
let WHO = 'family', CUR = null;
function run(){
  const city = $('#city').value.trim(); if (!city){ $('#city').classList.add('miss'); return toast('도시를 적어 주세요'); } $('#city').classList.remove('miss');
  const nights = +$('#nights').value, days = nights + 1, mode = $('#mode').value, km = num($('#km').value), budget = num($('#budget').value), pax = +$('#pax').value || 1;
  const start = parseD($('#start').value) || addDays(new Date(), 7);
  const pl = $('#places').value.split(/\r?\n/).map(s => s.trim()).filter(Boolean).map(l => { const [n, t] = l.split('|').map(x => (x || '').trim()); return {n, t:/식사|맛집|시장|식당/.test(t || n) ? '식사' : (/카페|커피/.test(t || n) ? '카페' : '관광')}; });
  const sights = pl.filter(p => p.t === '관광' || p.t === '체험'), foods = pl.filter(p => p.t === '식사'), cafes = pl.filter(p => p.t === '카페');
  let si = 0, fi = 0, ci = 0; const take = (arr, i) => i < arr.length ? arr[i] : null;
  const move = isFinite(km) && km > 0 ? Math.round(km / SPEED[mode] * 60) : null;
  const D = [];
  for (let d = 0; d < days; d++){
    const dt = addDays(start, d), first = d === 0, last = d === days - 1; const S = [];
    const mv = `${$('#from').value.trim() || '출발지'} ${first ? '→' : '←'} ${city} ${MODE_N[mode]}` + (move ? ` · 약 ${Math.floor(move / 60)}시간 ${move % 60}분(가정: 평균 ${SPEED[mode]}km/h)` : ' · 이동시간: 거리 입력 시 표시');
    if (first){ S.push(['오전', {n:mv, note:'이동'}]); }
    else { const p = take(sights, si++); S.push(['오전', p ? {n:p.n, note:'관광'} : null]); }
    const f1 = take(foods, fi++); S.push(['점심', f1 ? {n:f1.n, note:'식사'} : null]);
    if (last && days > 1){ const c = take(cafes, ci++) || take(sights, si++); S.push(['오후', c ? {n:c.n, note:c.t === '카페' ? '카페' : '관광'} : null]); S.push(['저녁', {n:mv, note:'귀가'}]); }
    else { const p = take(sights, si++); const c = !p ? take(cafes, ci++) : null; S.push(['오후', p ? {n:p.n, note:'관광'} : (c ? {n:c.n, note:'카페'} : null)]); const f2 = take(foods, fi++); S.push(['저녁', f2 ? {n:f2.n, note:'식사'} : null]); }
    if (days === 1) S[3] = ['저녁', {n:mv.replace('→', '←'), note:'귀가'}];
    D.push({dt, S, stay:!last});
  }
  const R = RATIO[WHO]; const B = isFinite(budget) && budget > 0 ? Object.keys(R).map(k => [k, Math.round(budget * R[k] / 1000) * 1000, R[k]]) : null;
  const m = start.getMonth() + 1; const kit = KIT.base.concat(KIT[WHO], KIT[mode], pl.some(p => /해변|바다|해수욕/.test(p.n)) ? KIT.beach : [], (m <= 2 || m >= 11) ? KIT.cold : [], (m >= 6 && m <= 8) ? KIT.hot : [], nights === 0 ? [] : ['숙소 예약 확인 문자']);
  const used = D.flatMap(x => x.S).filter(s => s[1] && s[1].note !== '이동' && s[1].note !== '귀가').length, blank = D.flatMap(x => x.S).filter(s => !s[1]).length;
  CUR = {city, nights, days, D, B, kit:[...new Set(kit)], budget, pax, mode, move, left:pl.length - (si + fi + ci > pl.length ? pl.length : Math.min(pl.length, si + fi + ci)), used, blank, unused:sights.slice(si).concat(foods.slice(fi), cafes.slice(ci)).map(p => p.n)};
  render();
}
const slotTxt = s => s ? s.n : '장소 입력';
function render(){
  const R = CUR; $('#rTitle').textContent = `${R.city} ${R.nights ? R.nights + '박 ' + R.days + '일' : '당일'} 코스`;
  $('#sDays').textContent = R.days + '일'; $('#sSlots').textContent = R.used; $('#sBlank').textContent = R.blank;
  $('#moveInfo').textContent = (R.move ? `이동시간은 입력 거리 기준 가정치입니다(평균 속도 가정, 휴게·정체 미반영).` : '거리를 넣지 않아 이동시간은 표시하지 않았습니다.') + (R.unused.length ? ` 남은 장소 ${R.unused.length}곳: ${R.unused.join(', ')}` : '');
  $('#days').innerHTML = R.D.map((d, i) => `<div class="day"><h4>${i + 1}일차 · ${korD(d.dt)}</h4>${d.S.map(([t, s]) => `<div class="slot"><span class="t">${t}</span><span class="p ${s ? '' : 'blank'}">${s ? esc(s.n) + `<small>${s.note}</small>` : '장소 입력 (목록에 더 적으면 채워집니다)'}</span></div>`).join('')}${d.stay ? '<div class="slot"><span class="t">숙소</span><span class="p blank">숙소 입력</span></div>' : ''}</div>`).join('');
  $('#budgetT').innerHTML = R.B ? `<table class="t"><tr><th>항목</th><th>비율(가정)</th><th>추정 금액</th></tr>${R.B.map(([k, v, r]) => `<tr><td>${k}</td><td>${Math.round(r * 100)}%</td><td>${won(v)}원</td></tr>`).join('')}<tr><th>합계</th><th>100%</th><th>${won(R.B.reduce((a, b) => a + b[1], 0))}원</th></tr></table><p class="kv">1인당 약 ${won(R.budget / R.pax)}원 · 비율은 동행 유형별 기본 가정이며 실제 요금이 아닙니다.</p>` : '<div class="empty">예산을 넣으면 항목별로 나눠 드립니다</div>';
  const ck = LS.get('kts_trip_kit_v1', {});
  $('#kit').innerHTML = R.kit.map((k, i) => `<label class="ck"><input type="checkbox" data-k="${esc(k)}" ${ck[k] ? 'checked' : ''}>${esc(k)}</label>`).join('');
  $$('#kit input').forEach(c => c.onchange = () => { const o = LS.get('kts_trip_kit_v1', {}); if (c.checked) o[c.dataset.k] = 1; else delete o[c.dataset.k]; LS.set('kts_trip_kit_v1', o); });
  $('#result').classList.remove('hide'); $('#result').scrollIntoView({block:'start'}); window.scrollBy(0, -60);
}
function text(){ const R = CUR; return `[${$('#rTitle').textContent}]\n` + R.D.map((d, i) => `■ ${i + 1}일차 ${korD(d.dt)}\n` + d.S.map(([t, s]) => `  ${t}: ${slotTxt(s)}`).join('\n') + (d.stay ? '\n  숙소: (입력)' : '')).join('\n') + (R.B ? '\n\n예산(추정): ' + R.B.map(([k, v]) => `${k} ${won(v)}원`).join(' · ') : '') + '\n준비물: ' + R.kit.join(', ') + '\n※ 영업시간·요금은 방문 전 공식 안내에서 확인'; }
$$('#who button').forEach(b => b.onclick = () => { WHO = b.dataset.k; $$('#who button').forEach(x => x.classList.toggle('on', x === b)); });
$('#sampleBtn').onclick = () => { $('#from').value = '하남'; $('#city').value = '강릉'; $('#nights').value = '2'; $('#start').value = ymd(addDays(new Date(), 10)); $('#budget').value = '800000'; $('#pax').value = 3; $('#mode').value = 'car'; $('#km').value = '220'; $('#places').value = SAMPLE_PLACES; WHO = 'family'; $$('#who button').forEach(x => x.classList.toggle('on', x.dataset.k === 'family')); toast('예시를 넣었습니다'); };
$('#runBtn').onclick = run;
$('#copyBtn').onclick = () => CUR && copyOut(text(), '코스를 복사했습니다');
$('#printBtn').onclick = () => { if (!CUR) return; const R = CUR; printDoc(`<div class="paper"><h1>${esc($('#rTitle').textContent)}</h1><p class="note">${R.pax}명 · ${MODE_N[R.mode]} · 장소·요금 미조회, 금액은 추정</p>
  <table><colgroup><col style="width:16%"><col><col><col><col></colgroup><tr><th>일자</th><th>오전</th><th>점심</th><th>오후</th><th>저녁</th></tr>${R.D.map((d, i) => `<tr><td>${i + 1}일차<br>${korD(d.dt)}</td>${d.S.map(([t, s]) => `<td>${esc(slotTxt(s))}</td>`).join('')}</tr>`).join('')}</table>
  ${R.B ? `<h2>예산(추정)</h2><table><tr>${R.B.map(([k]) => `<th>${k}</th>`).join('')}<th>합계</th></tr><tr>${R.B.map(([k, v]) => `<td>${won(v)}원</td>`).join('')}<td>${won(R.B.reduce((a, b) => a + b[1], 0))}원</td></tr></table>` : ''}
  <h2>준비물</h2><p>${R.kit.map(k => '□ ' + esc(k)).join('&nbsp;&nbsp; ')}</p><p class="note">장소·영업시간·요금은 조회하지 않았습니다. 방문 전 공식 안내에서 확인하세요.</p></div>`); };
$('#start').value = ymd(addDays(new Date(), 7));
</script>
</body></html>
