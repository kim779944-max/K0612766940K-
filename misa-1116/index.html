<html lang="ko">
<head>
<meta charset="utf-8">

<title>미사 010 발송판</title>
<meta name="theme-color" content="#0A1128">
<style>
  :root{
    --navy:#0A1128; --navy2:#111B36; --card:rgba(255,255,255,.045);
    --line:rgba(255,255,255,.09); --ink:#EAF0FA; --dim:#93A2BE;
    --orange:#FF7A1A; --green:#2ED47A; --red:#FF5C5C;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;width:100%;max-width:100%;overflow-x:hidden}
  body{
    background:radial-gradient(120% 80% at 50% 0%,#16234a 0%,var(--navy) 55%);
    color:var(--ink);min-height:100vh;min-height:100dvh;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:460px;margin:0 auto;padding:18px 14px 40px}
  /* ── 잠금 화면 ── */
  #lock{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;padding:24px 18px;text-align:center}
  .led{width:8px;height:8px;border-radius:50%;background:var(--orange);box-shadow:0 0 12px 3px rgba(255,122,26,.7);display:inline-block}
  .brand{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
  #lock h1{font-size:21px;margin:14px 0 6px;font-weight:800;letter-spacing:-.02em}
  #lock p.sub{font-size:12.5px;color:var(--dim);margin:0 0 22px;line-height:1.6}
  .dots{display:flex;gap:14px;margin-bottom:8px}
  .dot{width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(255,255,255,.28);transition:.15s}
  .dot.on{border-color:transparent;background:var(--orange);box-shadow:0 0 10px 1px rgba(255,122,26,.6)}
  .err{height:18px;font-size:12px;color:var(--red);margin:6px 0 10px}
  .shake{animation:sh .3s}
  @keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:280px}
  .pad button{
    height:56px;border-radius:14px;border:1px solid var(--line);
    background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
    color:var(--ink);font-size:21px;font-weight:600;font-family:inherit;
  }
  .pad button:active{background:rgba(255,122,26,.22);border-color:rgba(255,122,26,.5)}
  .pad button.ghost{font-size:14px;color:var(--dim)}
  /* ── 헤더 ── */
  #app{display:none}
  .head{position:sticky;top:0;z-index:20;background:rgba(10,17,40,.94);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);margin:0 -14px;padding:12px 14px 10px}
  .hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .hrow .t{font-size:15px;font-weight:800;letter-spacing:-.01em}
  .hrow .t small{display:block;font-size:10.5px;font-weight:500;color:var(--dim);letter-spacing:.02em;margin-top:2px}
  .count{font-size:13px;font-weight:800;color:var(--orange);white-space:nowrap}
  .bar{height:5px;border-radius:99px;background:rgba(255,255,255,.09);margin:9px 0 9px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#FF7A1A,#FFB020);transition:width .25s}
  .tabs{display:flex;gap:7px}
  .tab{flex:1;height:34px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.03);
    color:var(--dim);font-size:12px;font-weight:700;font-family:inherit}
  .tab.on{background:rgba(255,122,26,.16);border-color:rgba(255,122,26,.55);color:#FFD8B8}
  .search{margin-top:9px;width:100%;height:38px;border-radius:10px;border:1px solid var(--line);
    background:rgba(255,255,255,.03);color:var(--ink);padding:0 12px;font-size:13px;font-family:inherit}
  .search::placeholder{color:#6B7B99}
  .note{margin:12px 0 0;font-size:11px;line-height:1.6;color:var(--dim)}
  /* ── 카드 ── */
  .list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
  .card{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));
    border:1px solid var(--line);border-radius:16px;padding:13px 13px 12px}
  .card.done{border-color:rgba(46,212,122,.4);background:linear-gradient(180deg,rgba(46,212,122,.09),rgba(255,255,255,.015))}
  .crow{display:flex;align-items:flex-start;gap:9px}
  .no{flex:none;min-width:26px;height:22px;border-radius:7px;background:rgba(255,122,26,.16);
    color:#FFCB9E;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .card.done .no{background:rgba(46,212,122,.18);color:#8FF0BC}
  .nm{font-size:15px;font-weight:800;letter-spacing:-.01em;line-height:1.3;word-break:break-all}
  .meta{font-size:11px;color:var(--dim);line-height:1.55;margin-top:3px;word-break:break-all}
  .ph{font-size:14px;font-weight:700;letter-spacing:.02em;margin-top:6px;color:#CFE0F7}
  .acts{display:flex;gap:7px;margin-top:10px}
  .btn{height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);
    color:var(--ink);font-size:13px;font-weight:700;font-family:inherit;display:flex;align-items:center;justify-content:center;text-decoration:none}
  .btn:active{transform:scale(.98)}
  .btn.sms{flex:1;background:linear-gradient(180deg,#FF8A33,#F26312);border-color:#FF9A4D;color:#fff;font-size:14.5px;font-weight:800}
  .btn.sq{width:46px;flex:none;font-size:16px}
  .btn.tel{width:46px;flex:none}
  .btn.ok{height:40px;margin-top:8px;font-size:12.5px;color:#B9C7DE}
  .btn.ok.on{background:rgba(46,212,122,.16);border-color:rgba(46,212,122,.5);color:#8FF0BC}
  .prev{margin-top:8px;font-size:11px;color:var(--dim);border-top:1px dashed var(--line);padding-top:8px;white-space:pre-wrap;line-height:1.6;display:none}
  .prev.open{display:block}
  .pwrap{margin-top:8px}
  .ptog{background:none;border:0;color:#7F90AE;font-size:11px;font-family:inherit;padding:2px 0;text-decoration:underline;text-underline-offset:2px}
  .empty{text-align:center;color:var(--dim);font-size:13px;padding:34px 0}
  .foot{margin-top:22px;font-size:11px;color:#6B7B99;line-height:1.7;text-align:center}
  .foot a{color:#8FA6C9}
  details.rst{margin-top:16px;font-size:11.5px;color:var(--dim)}
  details.rst summary{cursor:pointer;color:#7F90AE}
  details.rst button{margin-top:9px;height:36px;padding:0 14px;border-radius:9px;border:1px solid rgba(255,92,92,.45);
    background:rgba(255,92,92,.12);color:#FFB4B4;font-size:12px;font-family:inherit;font-weight:700}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
    background:rgba(20,30,56,.97);border:1px solid rgba(255,122,26,.5);color:#FFE0C4;font-size:12.5px;font-weight:700;
    padding:11px 18px;border-radius:99px;transition:.2s;z-index:99;white-space:nowrap;max-width:92vw}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

  const raw = atob(b64);
  const bytes = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
  const ks = keystream(fnvSeed("MISA1116:" + pin), bytes.length);
  const plain = new Uint8Array(bytes.length);
  for (let i = 0; i < bytes.length; i++) plain[i] = bytes[i] ^ ks[i];
  return new TextDecoder("utf-8", {fatal: true}).decode(plain);
}

/* ───── 상태 ───── */
const KEY = "misa1116_sent_v1";
let STORES = [];
let sent = new Set();
let filter = "all";

function loadSent(){
  try{ sent = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); }catch(e){ sent = new Set(); }
}
function saveSent(){
  try{ localStorage.setItem(KEY, JSON.stringify([...sent])); }catch(e){}
}
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 1600);
}
function bodyFor(s){ return TPL.replace(/\{상호\}/g, s.name); }
function smsHref(s){ return "sms:" + s.tel + "?body=" + encodeURIComponent(bodyFor(s)); }

/* ───── 잠금 ───── */
let buf = "";
const dots = [...document.querySelectorAll("#dots .dot")];
function drawDots(){ dots.forEach((d, i) => d.classList.toggle("on", i < buf.length)); }
document.getElementById("pad").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  const k = b.dataset.k;
  const err = document.getElementById("err");
  if (k === "del"){ buf = buf.slice(0, -1); drawDots(); return; }
  if (k === "reset"){ buf = ""; drawDots(); err.textContent = ""; return; }
  if (buf.length >= 4) return;
  buf += k; drawDots(); err.textContent = "";
  if (buf.length === 4) setTimeout(() => submitPin(), 90);
});
function submitPin(){
  let data;
  try { data = JSON.parse(decrypt(PAYLOAD, buf)); }
  catch (e) { data = null; }
  if (!data || !data.length){
    const err = document.getElementById("err");
    err.textContent = "PIN이 맞지 않습니다";
    const w = document.getElementById("lock");
    w.classList.add("shake"); setTimeout(() => w.classList.remove("shake"), 320);
    buf = ""; drawDots();
    return;
  }
  STORES = data;
  document.getElementById("lock").style.display = "none";
  document.getElementById("app").style.display = "block";
  window.scrollTo(0, 0);
  loadSent(); render();
}

/* ───── 렌더 ───── */
function render(){
  const q = (document.getElementById("q").value || "").trim().toLowerCase();
  const total = STORES.length;
  const doneN = STORES.filter(s => sent.has(s.n)).length;
  document.getElementById("cnt").textContent = "완료 " + doneN + " / " + total;
  document.getElementById("bar").style.width = (total ? (doneN / total * 100) : 0) + "%";
  document.getElementById("tAll").textContent = "전체 " + total;
  document.getElementById("tTodo").textContent = "미발송 " + (total - doneN);
  document.getElementById("tDone").textContent = "보냈음 " + doneN;

  const rows = STORES.filter(s => {
    if (filter === "todo" && sent.has(s.n)) return false;
    if (filter === "done" && !sent.has(s.n)) return false;
    if (q && !(s.name.toLowerCase().includes(q) || (s.cat || "").toLowerCase().includes(q))) return false;
    return true;
  });

  const list = document.getElementById("list");
  if (!rows.length){ list.innerHTML = '<div class="empty">해당하는 업소가 없습니다</div>'; return; }
  list.innerHTML = rows.map(s => {
    const isDone = sent.has(s.n);
    return '<div class="card' + (isDone ? ' done' : '') + '" data-n="' + s.n + '">'
      + '<div class="crow"><div class="no">' + String(s.n).padStart(2, "0") + '</div><div style="flex:1;min-width:0">'
      + '<div class="nm">' + esc(s.name) + '</div>'
      + '<div class="meta">' + esc(s.cat || "") + ' · ' + esc(s.addr || "") + '</div>'
      + '<div class="ph">' + esc(s.telDisp) + '</div></div></div>'
      + '<div class="acts">'
      + '<a class="btn sms" href="' + smsHref(s) + '">📩 문자 열기</a>'
      + '<button class="btn sq" data-copy="' + s.n + '" aria-label="문구 복사">⧉</button>'
      + '<a class="btn tel" href="tel:' + s.tel + '" aria-label="전화걸기">☎</a>'
      + '</div>'
      + '<button class="btn ok' + (isDone ? ' on' : '') + '" data-ok="' + s.n + '">'
      + (isDone ? '✓ 보냈음' : '보냈음 체크') + '</button>'
      + '<div class="pwrap"><button class="ptog" data-prev="' + s.n + '">문구 미리보기</button></div>'
      + '<div class="prev" id="prev-' + s.n + '">' + esc(bodyFor(s)) + '</div>'
      + '</div>';
  }).join("");
}
function esc(t){
  return String(t == null ? "" : t).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ───── 동작 ───── */
document.addEventListener("click", e => {
  const tab = e.target.closest(".tab");
  if (tab){
    filter = tab.dataset.f;
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t === tab));
    render(); return;
  }
  const ok = e.target.closest("[data-ok]");
  if (ok){
    const n = Number(ok.dataset.ok);
    if (sent.has(n)){ sent.delete(n); toast("체크 해제"); } else { sent.add(n); toast("발송 완료로 기록"); }
    saveSent(); render(); return;
  }
  const cp = e.target.closest("[data-copy]");
  if (cp){
    const s = STORES.find(x => x.n === Number(cp.dataset.copy));
    copyText(bodyFor(s)); return;
  }
  const pv = e.target.closest("[data-prev]");
  if (pv){
    const n = pv.dataset.prev;
    document.getElementById("prev-" + n).classList.toggle("open");
    return;
  }
});
document.getElementById("q").addEventListener("input", render);
document.getElementById("resetAll").addEventListener("click", () => {
  if (!confirm("보냈음 체크를 모두 지웁니다. 계속할까요?")) return;
  sent.clear(); saveSent(); render(); toast("전체 초기화 완료");
});
function copyText(text){
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => toast("문구를 복사했습니다")).catch(() => fallbackCopy(text));
  } else fallbackCopy(text);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast("문구를 복사했습니다"); }
  catch(e){ toast("복사 실패 — 문구 미리보기에서 길게 눌러 복사하세요"); }
  document.body.removeChild(ta);
}
</script>
