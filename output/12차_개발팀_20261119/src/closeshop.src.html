<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KTS 더정리 — 폐업·양도 체크리스트 · KTS 원클릭</title>
<meta name="theme-color" content="#0A1128">
<style>
/*@@CSS@@*/
.ck{display:flex;gap:9px;background:#0B1530;border:1px solid var(--line);border-radius:11px;padding:9px 10px;margin-top:7px}
.ck label{flex:0 0 26px;display:grid;place-items:start center;padding-top:2px}
.ck .bd{flex:1;min-width:0}.ck .bd b{font-size:13px;color:#fff;display:block}
.ck .bd p{font-size:11.6px;color:#C9D3E2;margin-top:3px;line-height:1.5}.ck .bd p em{font-style:normal;color:var(--sub);font-weight:800}
.ck .dd{flex:0 0 auto;font-size:11.5px;font-weight:900;white-space:nowrap}
.ck.done{opacity:.5}.ck.done .bd b{text-decoration:line-through}
.stage{font-size:12px;font-weight:900;color:var(--or2);margin:14px 0 2px}
</style></head>
<body><div id="app">
<!--@@TOP KTS 더정리@@-->
<main>
<section class="hero">
 <h1>폐업·양도, 무엇부터?<br><em>순서대로 1장 체크리스트</em></h1>
 <p>임대차 → 시설·집기 → 세무 → 4대보험·직원 → 폐업신고 → 각종 해지 → 폐업사실증명 순서로, 항목마다 담당 기관·준비물·기한과 남은 날(D-day)을 보여 줍니다.</p>
 <p class="fixnote">기한·서식은 개정될 수 있으니 홈택스·관할 세무서·지자체에서 확인하세요.</p>
</section>
<section class="card" id="in">
 <h2><span class="n">1</span>우리 가게 상황</h2>
 <div class="row"><button class="btn sec sm" id="sampleBtn">예시 1: 개인 음식점 폐업</button><button class="btn sec sm" id="s2">예시 2: 법인 사무실 양도</button></div>
 <div class="g2"><div><label class="lb">업종</label><select id="ind"><option>음식점</option><option>카페</option><option>소매점</option><option>미용실</option><option>사무실</option><option>학원</option><option>기타</option></select></div>
 <div><label class="lb">사업자 형태</label><select id="kind"><option>개인</option><option>법인</option></select></div></div>
 <div class="g2"><div><label class="lb">무엇을</label><select id="mode"><option>폐업</option><option>양도</option></select></div><div><label class="lb">직원</label><select id="emp"><option value="0">없음</option><option value="1">있음</option></select></div></div>
 <div class="g2"><div><label class="lb">임대차 남은 기간 <i>개월</i></label><input id="left" inputmode="numeric"></div><div><label class="lb">폐업(양도) 예정일</label><input id="day" type="date"></div></div>
 <div class="g2"><div><label class="lb">권리금 <i>만원 · 선택</i></label><input id="key" inputmode="numeric"></div><div><label class="lb">위약금 <i>만원 · 선택</i></label><input id="pen" inputmode="numeric"></div></div>
</section>
<button class="btn pri" id="runBtn" style="margin-top:14px">체크리스트 만들기</button>
<section class="card hide" id="result">
 <h2><span class="n">2</span><span id="rTitle">체크리스트</span></h2>
 <div class="stat"><div><b id="sN">0</b><span>항목</span></div><div><b id="sDone">0</b><span>완료</span></div><div><b id="sSoon" style="color:var(--yel)">0</b><span>14일 안</span></div></div>
 <div class="row"><button class="btn pri sm" id="printBtn">인쇄 (1~2장)</button><button class="btn sec sm" id="copyBtn">복사</button><button class="btn sec sm" id="csvBtn">CSV</button></div>
 <div id="money"></div>
 <div id="list"></div>
 <p class="fixnote">기한·서식은 개정될 수 있으니 홈택스·관할 세무서·지자체에서 확인하세요. 법률·세무 판단이 아닌 일반 절차 안내입니다.</p>
</section>
<!--@@BOTTOM@@-->
</main></div>
<div id="toast"></div><div id="printArea"></div>
<script>
/*@@JS@@*/
/* 일반 절차 사전: [단계, 항목, 담당 기관, 준비물, 기한 규칙(폐업일 기준 일수 또는 함수), 조건] */
const nextMonthDay = (d, day) => new Date(d.getFullYear(), d.getMonth() + 1, day);
const STEPS = [
 ['임대차', '임대인에게 계약 종료·해지 의사 통지', '임대인', '임대차계약서 · 통지 문자/내용증명 사본', d => addDays(d, -60), '계약서의 해지 통지 기간을 먼저 확인(보통 1~3개월 전)'],
 ['임대차', '원상복구 범위 협의', '임대인', '입주 당시 사진 · 계약서 특약', d => addDays(d, -30), '특약에 적힌 범위만'],
 ['임대차', '신규 임차인 주선 · 권리금 계약', '임대인 · 신규 임차인 · 공인중개사', '권리금 계약서 · 시설 목록', d => addDays(d, -45), '임대차 종료 전 일정 기간 권리금 회수 기회 보호 규정 확인', o => o.mode === '양도' || o.key > 0],
 ['임대차', '보증금 반환 · 공과금 정산 확인', '임대인 · 관리사무소', '계좌 · 관리비 영수증', d => d, ''],
 ['시설 · 집기', '시설·집기 매각 또는 폐기 처리', '중고 업체 · 폐기물 업체', '집기 목록 · 사진', d => addDays(d, -14), ''],
 ['시설 · 집기', '양수인에게 넘길 집기 목록 확정', '양수인', '집기 목록 · 인수인계서', d => addDays(d, -14), '', o => o.mode === '양도'],
 ['양도', '사업 양수도 계약서 작성', '양수인 · 법무사·세무사', '계약서 · 재고·집기 목록', d => addDays(d, -30), '포괄양수도 해당 여부(부가세 처리) 확인', o => o.mode === '양도'],
 ['양도', '임대인 승계 동의(명의 변경)', '임대인', '임대차계약서', d => addDays(d, -30), '', o => o.mode === '양도'],
 ['양도', '거래처·고객에게 운영자 변경 안내', '거래처 · 단골', '안내 문구', d => addDays(d, -7), '', o => o.mode === '양도'],
 ['양도', '전화번호·인터넷 명의 이전', '통신사', '양도인·양수인 신분증', d => d, '', o => o.mode === '양도'],
 ['양도', '재고 실사 · 인계', '양수인', '재고 목록', d => addDays(d, -1), '', o => o.mode === '양도'],
 ['양도', '잔금 수령 · 영수증 교부', '양수인', '계좌 · 영수증', d => d, '', o => o.mode === '양도'],
 ['양도', '법인 등기사항 변경(대표·본점 등) 여부 확인', '관할 등기소 · 법무사', '주주총회·이사회 의사록', d => addDays(d, 14), '양도 방식(지분·사업)에 따라 다름', o => o.mode === '양도' && o.kind === '법인'],
 ['세무', '부가가치세 폐업 확정신고', '관할 세무서 · 홈택스', '매출·매입 자료 · 카드매출 내역', d => nextMonthDay(d, 25), '일반 기한: 폐업일이 속한 달의 다음 달 25일'],
 ['세무', '원천세 신고 · 지급명세서 제출', '관할 세무서 · 홈택스', '급여대장 · 퇴직금 내역', d => nextMonthDay(d, 10), '일반 기한: 다음 달 10일(지급명세서는 별도 기한 확인)', o => o.emp],
 ['세무', '종합소득세 신고', '관할 세무서 · 홈택스', '장부 · 경비 증빙', d => new Date(d.getFullYear() + 1, 4, 31), '일반 기한: 다음 해 5월', o => o.kind === '개인'],
 ['세무', '법인 해산·청산 절차와 법인세 신고', '관할 등기소 · 세무서 · 세무사', '정관 · 주주총회 의사록 · 재무제표', d => addDays(d, 30), '해산등기·청산 기한은 전문가와 확인', o => o.kind === '법인' && o.mode === '폐업'],
 ['4대보험 · 직원', '직원 퇴직금·남은 급여 정산', '직원', '근로계약서 · 급여대장', d => addDays(d, 14), '일반: 퇴직일부터 14일 이내 지급', o => o.emp],
 ['4대보험 · 직원', '4대보험 자격상실 신고', '4대사회보험 정보연계센터', '상실 사유 · 상실일', d => nextMonthDay(d, 15), '일반 기한: 다음 달 15일', o => o.emp],
 ['4대보험 · 직원', '사업장 탈퇴(적용 해지) 신고', '국민연금·건강보험·근로복지공단', '폐업사실증명', d => addDays(d, 14), '일반: 사유 발생 후 14일 안팎 — 공단별 확인', o => o.emp],
 ['폐업신고', '사업자등록 폐업신고', '관할 세무서 · 홈택스', '사업자등록증 · 신분증', d => d, '부가세 확정신고서에 폐업일을 적어 함께 낼 수도 있음'],
 ['폐업신고', '영업신고(허가) 폐업', '시·군·구청 위생과', '영업신고증 원본', d => d, '', o => /음식점|카페/.test(o.ind)],
 ['폐업신고', '업종별 인허가 반납·폐업 신고', '관할 지자체·교육청 등', '등록증 원본', d => d, '업종별 담당 기관 확인', o => /미용실|학원/.test(o.ind)],
 ['해지', '카드 단말기(VAN)·POS 해지', 'VAN사 · POS 업체', '가맹점 번호', d => addDays(d, -7), '위약금·반납 조건 확인'],
 ['해지', '배달앱·예약앱 입점 해지', '각 앱 사장님 센터', '사업자 계정', d => addDays(d, -7), '', o => /음식점|카페/.test(o.ind)],
 ['해지', '인터넷·전화·CCTV·정수기 등 렌탈 해지', '각 통신·렌탈사', '계약자 정보 · 약정 만료일', d => addDays(d, -7), '약정 위약금 확인'],
 ['해지', '광고·온라인 지도(플레이스) 정보 정리', '각 플랫폼', '사업자 계정', d => d, '영업 종료 표시'],
 ['해지', '화재·영업배상 보험 해지 · 공과금 명의 정리', '보험사 · 한전 · 수도·가스', '증권 번호 · 고객 번호', d => d, ''],
 ['마무리', '폐업사실증명 발급', '홈택스 · 정부24 · 세무서', '폐업신고 완료 후', d => addDays(d, 3), '대출·보험·지원금 신청에 쓰임'],
 ['마무리', '노란우산공제 폐업 공제금 청구(가입자)', '중소기업중앙회', '폐업사실증명', d => addDays(d, 30), '가입한 경우만'],
 ['마무리', '소상공인 폐업 지원사업 확인', '소상공인시장진흥공단', '폐업사실증명 · 사업자 정보', d => addDays(d, -30), '해당 연도 공고·요건 확인', o => o.kind === '개인']];
const KEY = 'kts_closeshop_ck';
let CUR = null;
function run(){
  const o = {ind:$('#ind').value, kind:$('#kind').value, mode:$('#mode').value, emp:$('#emp').value === '1', left:num($('#left').value), key:num($('#key').value) || 0, pen:num($('#pen').value), day:parseD($('#day').value)};
  if (!o.day){ $('#day').classList.add('miss'); return toast('폐업(양도) 예정일을 넣어 주세요'); } $('#day').classList.remove('miss');
  const today = new Date(new Date().toDateString());
  const items = STEPS.filter(s => !s[6] || s[6](o)).map((s, i) => { const due = s[4](o.day); return {st:s[0], t:s[1], org:s[2], need:s[3], due, note:s[5], dd:daysBetween(today, due)}; });
  CUR = {o, items, today, id:[o.ind, o.kind, o.mode, ymd(o.day)].join('|')}; render();
}
function render(){
  const C = CUR, ck = LS.get(KEY, {})[C.id] || {};
  $('#rTitle').textContent = `${C.o.kind} ${C.o.ind} ${C.o.mode} · ${ymd(C.o.day)}`; $('#sN').textContent = C.items.length; $('#sDone').textContent = C.items.filter((x, i) => ck[i]).length; $('#sSoon').textContent = C.items.filter((x, i) => !ck[i] && x.dd <= 14).length;
  $('#money').innerHTML = `<div class="item"><div class="a">임대차 남은 기간 ${isFinite(C.o.left) ? C.o.left + '개월' : '미입력'} · 권리금 ${C.o.key ? won(C.o.key) + '만원' : '미입력'} · 위약금 ${isFinite(C.o.pen) ? won(C.o.pen) + '만원' : '미입력'}${C.o.key && isFinite(C.o.pen) ? ` · 입력값 기준 차액 ${won(C.o.key - C.o.pen)}만원` : ''}</div><div class="kv">금액은 입력한 값으로만 계산합니다(추정 없음).</div></div>`;
  let st = '';
  $('#list').innerHTML = C.items.map((x, i) => { const head = x.st !== st ? `<div class="stage">${esc(x.st)}</div>` : ''; st = x.st; const col = ck[i] ? 'var(--green)' : x.dd < 0 ? 'var(--red)' : x.dd <= 14 ? 'var(--yel)' : 'var(--sub)';
    return head + `<div class="ck ${ck[i] ? 'done' : ''}"><label><input type="checkbox" data-i="${i}" ${ck[i] ? 'checked' : ''}></label><div class="bd"><b>${i + 1}. ${esc(x.t)}</b><p><em>기관</em> ${esc(x.org)}</p><p><em>준비물</em> ${esc(x.need)}</p><p><em>기한</em> ${korD(x.due)}${x.note ? ' · ' + esc(x.note) : ''}</p></div><span class="dd" style="color:${col}">${x.dd < 0 ? 'D+' + (-x.dd) : 'D-' + x.dd}</span></div>`; }).join('');
  $$('#list input').forEach(c => c.onchange = () => { const all = LS.get(KEY, {}); all[C.id] = all[C.id] || {}; all[C.id][c.dataset.i] = c.checked; LS.set(KEY, all); render(); });
  $('#result').classList.remove('hide');
}
function setEx(k){ const E = k ? {ind:'사무실', kind:'법인', mode:'양도', emp:'0', left:'14', day:ymd(addDays(new Date(), 75)), key:'', pen:'300'} : {ind:'음식점', kind:'개인', mode:'폐업', emp:'1', left:'8', day:ymd(addDays(new Date(), 40)), key:'3000', pen:'500'}; Object.keys(E).forEach(x => $('#' + x).value = E[x]); toast('예시를 넣었습니다'); }
$('#sampleBtn').onclick = () => setEx(0); $('#s2').onclick = () => setEx(1);
$('#runBtn').onclick = () => { run(); if (CUR){ $('#result').scrollIntoView({block:'start'}); window.scrollBy(0, -60); } };
const txt = () => `[${$('#rTitle').textContent} 체크리스트]\n` + CUR.items.map((x, i) => `${i + 1}. [ ] (${x.st}) ${x.t} — ${x.org} · 준비: ${x.need} · 기한 ${ymd(x.due)} (${x.dd < 0 ? 'D+' + (-x.dd) : 'D-' + x.dd})`).join('\n') + '\n※ 기한·서식은 개정될 수 있으니 홈택스·관할 세무서·지자체에서 확인하세요.';
$('#copyBtn').onclick = () => CUR && copyOut(txt(), '체크리스트를 복사했습니다');
$('#csvBtn').onclick = () => CUR && saveCSV(`폐업양도_체크리스트_${todayS()}.csv`, [['번호','단계','항목','기관','준비물','기한','D-day','비고']].concat(CUR.items.map((x, i) => [i + 1, x.st, x.t, x.org, x.need, ymd(x.due), x.dd, x.note])));
$('#printBtn').onclick = () => { if (!CUR) return; printDoc(`<div class="paper"><h1>${esc($('#rTitle').textContent)} 체크리스트</h1><p class="note">${todayS()} 기준 · 일반 절차 안내</p><table style="font-size:8.6pt"><tr><th style="width:4%">□</th><th style="width:4%">#</th><th style="width:10%">단계</th><th>항목</th><th style="width:18%">기관</th><th style="width:20%">준비물</th><th style="width:11%">기한</th><th style="width:6%">D</th></tr>${CUR.items.map((x, i) => `<tr><td>□</td><td>${i + 1}</td><td>${esc(x.st)}</td><td>${esc(x.t)}${x.note ? '<br><span style="color:#555">' + esc(x.note) + '</span>' : ''}</td><td>${esc(x.org)}</td><td>${esc(x.need)}</td><td>${ymd(x.due)}</td><td>${x.dd < 0 ? '+' + (-x.dd) : x.dd}</td></tr>`).join('')}</table><p class="note">기한·서식은 개정될 수 있으니 홈택스·관할 세무서·지자체에서 확인하세요.</p></div>`); };
</script>
</body></html>
