<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>시즌별 키워드·연관어 추출기 · KTS 원클릭</title>
<meta name="theme-color" content="#0A1128">
<style>
/*@@CSS@@*/
.kws{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.kws span{font-size:11.6px;background:#0B1530;border:1px solid var(--line2);border-radius:8px;padding:3px 8px;color:#DCE6F2;max-width:100%;overflow-wrap:anywhere}
.grp{display:flex;align-items:center;gap:6px;margin-top:12px}.grp b{flex:1;font-size:13px;color:var(--or2)}
.grp button{flex:0 0 auto;font-size:11px;font-weight:800;color:var(--or2);border:1px solid rgba(255,107,0,.45);border-radius:8px;padding:4px 9px}
</style></head>
<body><div id="app">
<!--@@TOP 시즌 키워드@@-->
<main>
<section class="hero">
 <h1>씨앗 키워드 3개로<br><em>시즌 키워드 300개</em></h1>
 <p>씨앗 × 시즌 × 행동어(구매·후기·가격·추천·비교·대여·설치…)를 조합하고, 중복·비문을 지운 뒤 구매의도 · 정보탐색 · 지역으로 나눕니다.</p>
 <p class="fixnote">검색량·경쟁도는 조회하지 않습니다(조합 생성기). 실시간 조회가 아니며 입력 자료 기준입니다.</p>
</section>
<section class="card" id="in">
 <h2><span class="n">1</span>씨앗 · 시즌</h2>
 <div class="row"><button class="btn sec sm" id="sampleBtn">예시: 난방 3종 · 겨울</button><button class="btn sec sm" id="s2">예시: 캠핑 · 여름</button></div>
 <label class="lb">씨앗 키워드 <i>1~3개, 쉼표로</i></label><input id="seed" maxlength="60">
 <div class="g2"><div><label class="lb">시즌</label><select id="sea"><option>봄</option><option>여름</option><option>가을</option><option selected>겨울</option><option>설·추석</option><option>입학·졸업</option><option>크리스마스</option></select></div><div><label class="lb">지역 <i>선택</i></label><input id="reg" maxlength="20"></div></div>
</section>
<button class="btn pri" id="runBtn" style="margin-top:14px">키워드 300개 만들기</button>
<section class="card hide" id="result">
 <h2><span class="n">2</span><span id="rTitle">키워드</span></h2>
 <div class="stat"><div><b id="sB">0</b><span>구매의도</span></div><div><b id="sI">0</b><span>정보탐색</span></div><div><b id="sR">0</b><span>지역</span></div></div>
 <div class="row"><button class="btn pri sm" id="csvBtn">CSV 저장</button><button class="btn sec sm" id="copyBtn">전체 복사</button><button class="btn sec sm" id="printBtn">인쇄</button></div>
 <div id="ex"></div><div id="groups"></div>
 <details class="rule"><summary>조합 규칙 · 제외 목록 (공개)</summary><div id="rules"></div></details>
</section>
<!--@@BOTTOM@@-->
</main></div>
<div id="toast"></div><div id="printArea"></div>
<script>
/*@@JS@@*/
const SEA = {봄:['봄','봄철','3월','4월','환절기','신학기','봄맞이','봄나들이'], 여름:['여름','여름철','7월','8월','장마철','휴가철','무더위','여름휴가'], 가을:['가을','가을철','9월','10월','환절기','단풍철','가을맞이','추석 전'], 겨울:['겨울','겨울철','12월','1월','한파','동절기','연말','김장철'],
 '설·추석':['설날','추석','명절','명절 전','귀성길','연휴','명절선물','차례상'], '입학·졸업':['입학','졸업','새학기','입학식','졸업식','2월','3월','신입생'], 크리스마스:['크리스마스','성탄절','12월','연말','홈파티','송년회','겨울방학','12월 셋째주']};
const BUY = ['구매','가격','추천','비교','대여','설치','할인','주문','가성비','세트','렌탈','견적'];
const INFO = ['후기','고르는법','종류','사용법','관리법','보관법','준비물','주의사항','장단점','차이','청소법','크기'];
const LOCA = ['추천','가격','설치','대여','매장','업체','당일'];
const EXCL = [['비속어', ['씨발','존나','개새','병신']], ['상표', ['나이키','삼성','LG','다이슨','쿠팡','이케아','다이소','샤오미','애플','캠핑카닷컴']], ['의료 표현', ['치료','효과','효능','처방','완치','부작용','의약','진통']]];
const bad = k => { for (const [n, L] of EXCL) if (L.some(w => k.includes(w))) return n; return null; };
let CUR = null;
function run(){
  const seeds = $('#seed').value.split(',').map(s => s.trim()).filter(Boolean).slice(0, 3), sea = $('#sea').value, reg = $('#reg').value.trim();
  if (!seeds.length){ $('#seed').classList.add('miss'); return toast('씨앗 키워드를 1개 이상 넣어 주세요'); } $('#seed').classList.remove('miss');
  const S = SEA[sea], seen = new Set(), dropped = []; const G = {구매의도:[], 정보탐색:[], 지역:[]};
  const add = (g, k) => { k = k.replace(/\s+/g, ' ').trim(); const key = k.replace(/\s/g, ''); const w = k.split(' '); if (seen.has(key) || new Set(w).size !== w.length) return; seen.add(key); const b = bad(k); if (b){ dropped.push([k, b]); return; } G[g].push(k); };
  const rr = fn => { const M = Math.max(BUY.length, INFO.length, S.length); for (let i = 0; i < M; i++) seeds.forEach(sd => fn(sd, i)); };
  /* 1) 시즌 × 씨앗 × 행동어 (씨앗마다 돌아가며 고르게) */
  for (let si = 0; si < S.length; si++) rr((sd, i) => { if (i < BUY.length) add('구매의도', `${S[si]} ${sd} ${BUY[i]}`); if (i < INFO.length) add('정보탐색', `${S[si]} ${sd} ${INFO[i]}`); });
  rr((sd, i) => { if (i < BUY.length) add('구매의도', `${sd} ${BUY[i]}`); if (i < INFO.length) add('정보탐색', `${sd} ${INFO[i]}`); });
  if (reg){ seeds.forEach(sd => LOCA.forEach(a => add('지역', `${reg} ${sd} ${a}`))); seeds.forEach(sd => S.slice(0, 4).forEach(s => add('지역', `${reg} ${s} ${sd}`))); }
  /* 300개 맞추기: 지역 → 구매의도 → 정보탐색 비율 유지 */
  const total = 300, nR = Math.min(G.지역.length, reg ? 45 : 0), rest = total - nR, nB = Math.min(G.구매의도.length, Math.ceil(rest * 0.55)), nI = Math.min(G.정보탐색.length, rest - nB);
  const out = {구매의도:G.구매의도.slice(0, nB + Math.max(0, rest - nB - nI)), 정보탐색:G.정보탐색.slice(0, nI), 지역:G.지역.slice(0, nR)};
  CUR = {seeds, sea, reg, out, dropped, seedBad:seeds.map(s => [s, bad(s)]).filter(x => x[1])}; render();
}
const total = () => Object.values(CUR.out).reduce((a, L) => a + L.length, 0);
function render(){
  const C = CUR; $('#rTitle').textContent = `키워드 ${total()}개 · ${C.seeds.join(', ')} · ${C.sea}`; $('#sB').textContent = C.out.구매의도.length; $('#sI').textContent = C.out.정보탐색.length; $('#sR').textContent = C.out.지역.length;
  $('#ex').innerHTML = (C.seedBad.length ? `<div class="item warn"><div class="q">씨앗에 제외 대상 표현이 있습니다</div><div class="a">${C.seedBad.map(x => esc(x[0]) + ' (' + x[1] + ')').join(', ')} — 이 씨앗이 들어간 조합은 모두 뺐습니다.</div></div>` : '') + `<p class="kv">제외 목록에 걸려 뺀 조합 ${C.dropped.length}개 · 중복·같은 낱말 반복 조합 자동 삭제</p>`;
  $('#groups').innerHTML = Object.entries(C.out).filter(e => e[1].length).map(([g, L]) => `<div class="grp"><b>${g} ${L.length}개</b><button data-g="${g}">복사</button></div><div class="kws">${L.map(k => `<span>${esc(k)}</span>`).join('')}</div>`).join('') + (C.reg ? '' : '<p class="kv">지역을 넣으면 지역 키워드 묶음이 생깁니다.</p>');
  $$('[data-g]').forEach(b => b.onclick = () => copyOut(C.out[b.dataset.g].join('\n'), b.dataset.g + ' 키워드를 복사했습니다'));
  $('#rules').innerHTML = `<p class="kv">구매의도 = [시즌] [씨앗] [${BUY.join('·')}] / 정보탐색 = [시즌] [씨앗] [${INFO.join('·')}] / 지역 = [지역] [씨앗] [${LOCA.join('·')}] + [지역] [시즌] [씨앗]. 시즌어: ${SEA[C.sea].join('·')}. 공백 무시 중복 삭제, 같은 낱말이 두 번 들어간 조합(비문) 삭제. 300개를 넘으면 지역 최대 45 → 구매의도 55% → 정보탐색 순으로 자릅니다.</p>${EXCL.map(([n, L]) => `<p class="kv"><b>제외(${n})</b> ${L.join(' · ')}</p>`).join('')}`;
  $('#result').classList.remove('hide'); $('#result').scrollIntoView({block:'start'}); window.scrollBy(0, -60);
}
$('#sampleBtn').onclick = () => { $('#seed').value = '전기요, 온풍기, 가습기'; $('#sea').value = '겨울'; $('#reg').value = '하남'; toast('예시를 넣었습니다'); };
$('#s2').onclick = () => { $('#seed').value = '캠핑 의자, 텐트, 아이스박스'; $('#sea').value = '여름'; $('#reg').value = '가평'; toast('예시를 넣었습니다'); };
$('#runBtn').onclick = run;
$('#copyBtn').onclick = () => CUR && copyOut(Object.values(CUR.out).flat().join('\n'), `키워드 ${total()}개를 복사했습니다`);
$('#csvBtn').onclick = () => CUR && saveCSV(`시즌키워드_${todayS()}.csv`, [['번호','그룹','키워드','씨앗','시즌','비고']].concat(Object.entries(CUR.out).flatMap(([g, L]) => L.map(k => [g, k, CUR.seeds.find(s => k.includes(s)) || '', CUR.sea, '검색량 미조회(조합)']))).map((r, i) => i ? [i].concat(r) : r));
$('#printBtn').onclick = () => { if (!CUR) return; printDoc(`<div class="paper"><h1>시즌 키워드 ${total()}개</h1><p class="note">${todayS()} · 씨앗 ${esc(CUR.seeds.join(', '))} · ${CUR.sea}${CUR.reg ? ' · ' + esc(CUR.reg) : ''} · 검색량·경쟁도는 조회하지 않습니다(조합 생성기)</p>${Object.entries(CUR.out).filter(e => e[1].length).map(([g, L]) => `<h2>${g} ${L.length}개</h2><p style="font-size:8.6pt;line-height:1.6">${L.map(esc).join(' · ')}</p>`).join('')}</div>`); };
</script>
</body></html>
