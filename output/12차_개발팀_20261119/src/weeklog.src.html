<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KTS 더일지 — 흩어진 업무 메모 → 주간 업무일지·진행률 · KTS 원클릭</title>
<meta name="theme-color" content="#0A1128">
<style>
/*@@CSS@@*/
.day{background:#0B1530;border:1px solid var(--line);border-radius:11px;padding:9px 10px;margin-top:7px}
.day h4{font-size:13px;color:#fff;margin-bottom:4px}
.ln{display:flex;gap:6px;align-items:flex-start;font-size:12px;color:#D3DBE7;padding:2px 0;line-height:1.5}
.ln .pill{flex:0 0 auto;margin-top:2px}
.pg{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px}
.pg i{font-style:normal;flex:0 0 84px;color:#fff;font-weight:800;overflow-wrap:anywhere}
.pg .tr{flex:1;height:10px;border-radius:5px;background:#1B2846;overflow:hidden}.pg .tr u{display:block;height:100%;background:linear-gradient(90deg,var(--or2),var(--or))}
.pg em{font-style:normal;flex:0 0 40px;text-align:right;font-weight:900;color:#fff}
</style></head>
<body><div id="app">
<!--@@TOP KTS 더일지@@-->
<main>
<section class="hero">
 <h1>요일별로 적어 둔 메모를<br><em>주간 업무일지</em> 1장으로</h1>
 <p>여러 날 메모를 한 번에 붙여 넣으면 날짜별로 나누고, 줄마다 완료·진행·보류·막힘으로 분류(규칙 공개)해 프로젝트별 진행률, 다음 주 할 일, 보고용 요약 1장을 만듭니다.</p>
 <p class="fixnote">메모에 없는 업무를 만들지 않습니다. 분류가 애매한 줄은 "분류 확인" 칸에 둡니다.</p>
</section>
<section class="card" id="in">
 <h2><span class="n">1</span>메모</h2>
 <div class="row"><button class="btn sec sm" id="sampleBtn">예시 5일치 40줄</button><button class="btn sec sm" id="clearBtn">지우기</button></div>
 <div class="g2"><div><label class="lb">담당자</label><input id="who" maxlength="20"></div><div><label class="lb">주 시작일 (월)</label><input id="wk" type="date"></div></div>
 <label class="lb">날짜 줄(예: 11/16(월)) 아래에 그날 메모 · [프로젝트]로 시작하면 묶음</label>
 <textarea id="memo" rows="12" maxlength="40000"></textarea>
</section>
<button class="btn pri" id="runBtn" style="margin-top:14px">업무일지 만들기</button>
<section class="card hide" id="result">
 <h2><span class="n">2</span><span id="rTitle">주간 업무일지</span></h2>
 <div id="cnt"></div>
 <div class="row"><button class="btn pri sm" id="printBtn">요약 1장 인쇄</button><button class="btn sec sm" id="copyBtn">요약 복사</button><button class="btn sec sm" id="csvBtn">CSV</button></div>
 <h3>보고용 요약</h3><div class="out" id="sum"></div>
 <h3>프로젝트별 진행률</h3><div id="prog"></div>
 <h3>다음 주 할 일</h3><div id="next"></div>
 <h3>분류 확인</h3><div id="amb"></div>
 <h3>날짜별</h3><div id="days"></div>
 <details class="rule"><summary>분류 규칙 (공개)</summary><div class="kv" id="rules"></div></details>
</section>
<!--@@BOTTOM@@-->
</main></div>
<div id="toast"></div><div id="printArea"></div>
<script>
/*@@JS@@*/
const SAMPLE = `11/16(월)
[미사상가] 임대인 미팅 완료
[미사상가] 임대차 조건표 작성 중
[홈페이지] 메인 배너 시안 3종 작업 중
[홈페이지] 호스팅 결제 오류로 막힘
[세무] 10월 매입 영수증 정리 완료
[교환매물] 가평 토지 사진 촬영 완료
[교환매물] 상대 측 회신 없음
점심 회의 메모 공유
11/17(화)
[미사상가] 임대차 조건표 작성 완료
[미사상가] 권리금 협상 보류 (임대인 출장)
[홈페이지] 배너 시안 고객 검토 중
[홈페이지] 호스팅 결제 문제 해결 완료
[세무] 부가세 예정고지 확인 완료
[교환매물] 감정평가 의뢰 진행 40%
[교환매물] 등기부 열람 완료
거래처 전화 3통
11/18(수)
[미사상가] 현장 사진 정리 완료
[미사상가] 인테리어 견적 비교 진행 중
[홈페이지] 배너 수정 요청 반영 중
[홈페이지] 상세페이지 문구 작성 완료
[세무] 카드 내역 분류 작업 중
[교환매물] 감정평가 진행 70%
[교환매물] 융자 승계 은행 문의했으나 답변 지연
사무실 복합기 토너 교체
11/19(목)
[미사상가] 인테리어 견적 3곳 비교 완료
[미사상가] 임대인과 권리금 재협상 다음 주로 연기
[홈페이지] 배너 최종본 고객 승인 완료
[홈페이지] 모바일 화면 깨짐 오류
[세무] 카드 내역 분류 완료
[교환매물] 감정평가 결과 수령 완료
[교환매물] 상대 측 조건표 검토 중
[세무] 4분기 예정신고 자료 목록 작성 중
11/20(금)
[미사상가] 계약서 초안 작성 중
[홈페이지] 모바일 화면 깨짐 수정 완료
[홈페이지] 오픈 일정 다음 주 화요일 예정
[세무] 증빙 없는 지출 3건 확인 필요
[교환매물] 교환 조건 1차 제안서 발송 완료
[교환매물] 세무사 상담 대기
[미사상가] 임대인 회신 대기
주간 회의`;
/* 상태 낱말: 줄에서 가장 뒤에 나오는 낱말의 상태로 정함 */
const KW = {완료:['완료', '끝냄', '끝남', '마침', '마무리', '발송함', '제출함', '처리함', '해결', '수령', '승인'], 진행:['진행', '작업 중', '검토 중', '작성 중', '반영 중', '하는 중', '%'], 보류:['보류', '연기', '미룸', '다음 주로', '대기'], 막힘:['막힘', '안 됨', '안됨', '오류', '문제', '못 함', '못함', '불가', '회신 없', '답변 지연', '지연', '깨짐']};
const ST = ['완료', '진행', '보류', '막힘'], PILL = {완료:'ok', 진행:'c', 보류:'md', 막힘:'hi', 확인:'d'};
function status(t){ let best = null, pos = -1; ST.forEach(s => KW[s].forEach(w => { const i = t.lastIndexOf(w); if (i >= 0 && i + w.length > pos){ pos = i + w.length; best = s; } })); return best || '확인'; }
const DH = /^\s*(?:(\d{4})[-./])?(\d{1,2})[/.\-월]\s*(\d{1,2})\s*일?\s*(?:\(([월화수목금토일])\))?\s*$|^\s*([월화수목금토일])요일\s*$/;
let CUR = null;
function run(){
  const D = []; let cur = null;
  $('#memo').value.replace(/\r/g, '').split('\n').forEach(l => { if (!l.trim()) return; const m = DH.exec(l); if (m){ cur = {h:l.trim(), L:[]}; D.push(cur); return; } if (!cur){ cur = {h:'날짜 없음', L:[]}; D.push(cur); } cur.L.push(l.trim()); });
  const L = D.flatMap((d, di) => d.L.map(t => { const pm = /^\[([^\]]+)\]\s*(.*)$/.exec(t); const pc = /(\d{1,3})\s*%/.exec(t); return {day:d.h, di, t, p:pm ? pm[1] : '기타', body:pm ? pm[2] : t, s:status(t), pct:pc ? +pc[1] : null}; }));
  if (!L.length){ $('#memo').classList.add('miss'); return toast('메모를 넣어 주세요'); } $('#memo').classList.remove('miss');
  const P = uniq(L.filter(x => x.p !== '기타').map(x => x.p)).map(p => { const xs = L.filter(x => x.p === p), cl = xs.filter(x => x.s !== '확인'), done = cl.filter(x => x.s === '완료').length;
    const lastPct = xs.filter(x => x.pct != null).pop(), last = xs[xs.length - 1];
    return {p, n:xs.length, done, pct:Math.round(done / Math.max(1, cl.length) * 100), how:`완료 ${done} ÷ 분류된 ${cl.length}줄`, explicit:lastPct ? lastPct.pct : null, last}; });
  const next = uniq(L.filter(x => /다음 ?주|예정\s*$|확인 필요/.test(x.t)).concat(P.filter(p => p.last.s !== '완료').map(p => p.last)).concat(L.filter(x => x.s === '막힘' && !L.some(y => y.p === x.p && y.di > x.di && y.s === '완료' && sim(y.body, x.body))))).filter((x, i, a) => a.indexOf(x) === i);
  CUR = {D, L, P, next, who:$('#who').value.trim() || '담당자', wk:$('#wk').value}; render();
}
function sim(a, b){ const w = s => uniq(words(s).map(x => x.replace(/(완료|중|오류|문제|깨짐|수정)$/, ''))).filter(x => x.length >= 2); const A = w(a), B = w(b); return A.filter(x => B.includes(x)).length >= 2; }
function render(){
  const C = CUR, cnt = s => C.L.filter(x => x.s === s).length;
  $('#rTitle').textContent = `${C.who} 주간 업무일지 · ${C.D.length}일 · ${C.L.length}줄`;
  $('#cnt').innerHTML = `<div class="stat">${['완료', '진행', '보류'].map(s => `<div><b>${cnt(s)}</b><span>${s}</span></div>`).join('')}</div><div class="stat">${['막힘', '확인'].map(s => `<div><b style="color:${s === '막힘' ? 'var(--red)' : 'var(--yel)'}">${cnt(s)}</b><span>${s === '확인' ? '분류 확인' : s}</span></div>`).join('')}<div><b>${C.P.length}</b><span>프로젝트</span></div></div>`;
  const pl = C.P.map(p => ({...p, show:p.explicit != null && p.last.pct != null ? p.explicit : p.pct}));
  $('#prog').innerHTML = pl.map(p => `<div class="pg"><i>${esc(p.p)}</i><span class="tr"><u style="width:${p.show}%"></u></span><em>${p.show}%</em></div><div class="kv" style="margin:1px 0 0 90px">${p.explicit != null && p.last.pct != null ? '메모에 적은 ' + p.explicit + '% (마지막 줄)' : p.how}${p.explicit != null && p.last.pct == null ? ` · 메모의 ${p.explicit}%는 이후 줄이 있어 줄 수로 계산` : ''}</div>`).join('') || '<p class="empty">[프로젝트] 표시가 없습니다</p>';
  C.pl = pl;
  $('#next').innerHTML = C.next.length ? C.next.map(x => `<div class="ln"><span class="pill ${PILL[x.s]}">${x.s === '확인' ? '확인' : x.s}</span><span>${esc(x.t)} <span class="kv">(${esc(x.day)})</span></span></div>`).join('') : '<p class="empty">없음</p>';
  const A = C.L.filter(x => x.s === '확인');
  $('#amb').innerHTML = A.length ? A.map(x => `<div class="ln"><span class="pill d">확인</span><span>${esc(x.t)} <span class="kv">(${esc(x.day)}) — 상태 낱말이 없어 분류하지 않음</span></span></div>`).join('') : '<p class="empty">없음</p>';
  $('#days').innerHTML = C.D.map(d => `<div class="day"><h4>${esc(d.h)} · ${d.L.length}줄</h4>${C.L.filter(x => x.day === d.h).map(x => `<div class="ln"><span class="pill ${PILL[x.s]}">${x.s}</span><span>${esc(x.t)}</span></div>`).join('')}</div>`).join('');
  const top = pl.slice().sort((a, b) => b.show - a.show), blk = C.L.filter(x => x.s === '막힘');
  C.sum = `1. 이번 주 ${C.L.length}줄: 완료 ${cnt('완료')} · 진행 ${cnt('진행')} · 보류 ${cnt('보류')} · 막힘 ${cnt('막힘')} · 분류 확인 ${cnt('확인')}\n2. 진행률: ${top.map(p => p.p + ' ' + p.show + '%').join(', ') || '-'}\n3. 막힘 ${blk.length}건: ${blk.map(x => x.t.replace(/^\[[^\]]+\]\s*/, '')).join(' / ') || '없음'} · 다음 주 할 일 ${C.next.length}건`;
  $('#sum').textContent = C.sum;
  $('#rules').innerHTML = ST.map(s => `<b>${s}</b>: ${KW[s].join(', ')}`).join('<br>') + '<br>한 줄에 여러 낱말이 있으면 가장 뒤에 나온 낱말로 정합니다(예: "결제 문제 해결 완료" → 완료). 아무 낱말도 없으면 "분류 확인". 진행률 = 마지막 줄에 %가 적혀 있으면 그 값, 아니면 완료 줄 ÷ 분류된 줄. 다음 주 할 일 = "다음 주"·"확인 필요"가 들어가거나 "예정"으로 끝나는 줄 + 마지막 줄이 완료가 아닌 프로젝트의 마지막 줄 + 뒤에 해결되지 않은 막힘.';
  $('#result').classList.remove('hide');
}
$('#sampleBtn').onclick = () => { $('#memo').value = SAMPLE; $('#who').value = '김OO'; $('#wk').value = '2026-11-16'; toast('예시 5일치 40줄을 넣었습니다'); };
$('#clearBtn').onclick = () => { $('#memo').value = ''; };
$('#runBtn').onclick = () => { run(); if (CUR){ $('#result').scrollIntoView({block:'start'}); window.scrollBy(0, -60); } };
$('#copyBtn').onclick = () => CUR && copyOut(`[${CUR.who} 주간 업무 보고${CUR.wk ? ' · ' + CUR.wk + ' 주' : ''}]\n${CUR.sum}\n\n다음 주 할 일\n${CUR.next.map(x => '- ' + x.t).join('\n')}`, '요약을 복사했습니다');
$('#csvBtn').onclick = () => CUR && saveCSV(`주간업무일지_${todayS()}.csv`, [['날짜','프로젝트','메모','분류','%']].concat(CUR.L.map(x => [x.day, x.p, x.body, x.s === '확인' ? '분류 확인' : x.s, x.pct == null ? '' : x.pct])));
$('#printBtn').onclick = () => { if (!CUR) return; printDoc(`<div class="paper"><h1>주간 업무일지 · ${esc(CUR.who)}</h1><p class="note">${CUR.wk ? esc(CUR.wk) + ' 주 · ' : ''}${CUR.D.map(d => esc(d.h)).join(' · ')} · 메모 ${CUR.L.length}줄 기준</p><h2>요약</h2><div class="pre">${esc(CUR.sum)}</div><h2>프로젝트 진행률</h2><table><tr><th>프로젝트</th><th style="width:14%">진행률</th><th style="width:12%">줄 수</th><th>마지막 상태</th></tr>${CUR.pl.map(p => `<tr><td>${esc(p.p)}</td><td>${p.show}%</td><td>${p.n}</td><td>${esc(p.last.s)} · ${esc(p.last.body)}</td></tr>`).join('')}</table><h2>다음 주 할 일</h2><ul style="margin-left:18px">${CUR.next.map(x => `<li>${esc(x.t)}</li>`).join('')}</ul><h2>막힘 · 분류 확인</h2><p style="font-size:9.5pt">${CUR.L.filter(x => x.s === '막힘' || x.s === '확인').map(x => esc(`[${x.s === '확인' ? '분류 확인' : x.s}] ${x.t} (${x.day})`)).join('<br>') || '없음'}</p></div>`); };
</script>
</body></html>
