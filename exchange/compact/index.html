  return v.length > 30 ? v.slice(0,30) + '…' : v;
}

function render(){
  const kw = q.trim().toLowerCase();
  const list = DATA.filter(d => {
    if(curT !== '전체' && d.t !== curT) return false;
    if(!kw) return true;
    return (d.name + ' ' + d.addr + ' ' + d.reg + ' ' + d.t + ' ' + d.want).toLowerCase().includes(kw);
  });
  $('#cnt').innerHTML = kw || curT !== '전체'
    ? `조건에 맞는 매물 <b>${list.length}건</b> · 전체 ${DATA.length}건`
    : `전체 <b>${DATA.length}건</b> · 교환가와 실인수금을 그대로 표기했습니다`;
  if(!list.length){
    $('#list').innerHTML = `<div class="empty">조건에 맞는 매물이 없습니다.<br>다른 지역이나 유형으로 찾아보세요.</div>`;
    return;
  }
  $('#list').innerHTML = list.map((d,i) => `
    <div class="card" data-i="${DATA.indexOf(d)}">
      <div class="ctop">
        <span class="tag">${esc(d.t)}</span>
        <span class="tag reg">${esc(d.reg)}</span>
        <span class="tag g">${esc(d.g)}</span>
      </div>
      <div class="cname">${esc(d.name)}</div>
      <div class="caddr">${esc(d.addr)}</div>
      <div class="cmoney">
        <div class="mbox"><span>교환가</span><b>${esc(shortMoney(d.price))}</b></div>
        <div class="mbox hi"><span>실인수금</span><b>${esc(shortMoney(d.real))}</b></div>
      </div>
      <div class="cwant"><b>희망</b>${esc(d.want || '협의')}</div>
      <div class="more">권리·조건 자세히 보기 ▾</div>
    </div>`).join('');
  document.querySelectorAll('.card').forEach(el => {
    el.onclick = () => openSheet(+el.dataset.i);
  });
}

function openSheet(i){
  const d = DATA[i];
  const rows = [
    ['유형', d.t], ['지역', d.reg], ['주소', d.addr],
    ['규모', d.scale], ['교환가', d.price], ['부채', d.debt], ['실인수금', d.real],
    ['희망 조건', d.want], ['구분', d.g], ['접수일', d.date]
  ].filter(r => r[1]);
  $('#sheetBody').innerHTML = `
    <div class="grab"></div>
    <button class="sclose" id="sx">✕</button>
    <span class="tag">${esc(d.t)}</span> <span class="tag reg">${esc(d.reg)}</span>
    <div class="sname">${esc(d.name)}</div>
    <div class="saddr">${esc(d.addr)}</div>
    <div class="rows">${rows.map(r => `<div class="rw"><div class="k">${r[0]}</div><div class="v">${esc(r[1])}</div></div>`).join('')}</div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <a class="btn ghost" href="tel:010-2002-2899" style="display:grid;place-items:center;text-decoration:none;flex:0 0 116px">전화</a>
      <a class="btn main" href="sms:010-2002-2899?body=${encodeURIComponent('[교환 문의] ' + d.no + ' ' + d.name.slice(0,28))}" style="display:grid;place-items:center;text-decoration:none">문자로 조건 문의</a>
    </div>
    <div class="foot"><b>매물번호 ${esc(d.no)}</b> · 표기된 교환가·실인수금은 접수 시점 기준이며, 현장 확인과 권리분석 후 최종 조건이 정해집니다.</div>`;
  $('#sheet').classList.add('on');
  $('#sx').onclick = closeSheet;
  document.body.style.overflow = 'hidden';
}
function closeSheet(){
  $('#sheet').classList.remove('on');
  document.body.style.overflow = '';
}
$('#sheet').onclick = e => { if(e.target.id === 'sheet') closeSheet(); };
$('#q').oninput = e => { q = e.target.value; render(); };
$('#clear').onclick = () => { q = ''; $('#q').value = ''; render(); };
document.querySelectorAll('#chips .chip').forEach(c => {
  c.onclick = () => {
    document.querySelectorAll('#chips .chip').forEach(x => x.classList.remove('on'));
    c.classList.add('on'); curT = c.dataset.t; render();
  };
});
$('#askBtn').onclick = () => {
  location.href = 'sms:010-2002-2899?body=' + encodeURIComponent('[교환 문의] 조건이 맞는 매물을 찾고 있습니다.');
};
render();
</script>
</body>
</html>
