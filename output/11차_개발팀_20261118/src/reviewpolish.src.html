<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>독서·영화 메모 → 블로그 리뷰 윤문기 · KTS 원클릭</title>
<meta name="theme-color" content="#0A1128">
<style>
/*@@CSS@@*/
.spoil{font-size:12.5px;font-weight:900;color:#fff;background:rgba(255,90,90,.18);border:1px solid var(--red);border-radius:10px;padding:8px 10px;margin-top:8px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tags span{font-size:11.5px;font-weight:800;color:#DCE6F2;background:var(--card2);border:1px solid var(--line2);border-radius:999px;padding:4px 9px}
.para{font-size:13.5px;line-height:1.75;color:#E3E9F2;background:#0B1530;border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:7px;white-space:pre-wrap}
.para h5{font-size:11px;color:var(--or2);margin-bottom:3px}
.chg{font-size:11px;color:var(--sub);margin-top:6px}
</style></head>
<body><div id="app">
<!--@@TOP 독서·영화 메모 → 리뷰 윤문기@@-->
<main>
<section class="hero">
 <h1>메모 몇 줄을 넣으면<br><em>3문단 블로그 리뷰</em>로 다듬기</h1>
 <p>원문에 없는 감상·줄거리는 만들지 않습니다. 중복·군더더기를 덜어 내고 말끝만 맞추며, 따옴표 속 인용 문장은 한 글자도 바꾸지 않습니다.</p>
</section>
<section class="card">
 <h2><span class="n">1</span>작품 · 메모</h2>
 <div class="row"><button class="btn sec sm" id="sampleBtn">예시 1 · 책</button><button class="btn sec sm" id="sample2Btn">예시 2 · 영화</button></div>
 <div class="g2"><div><label class="lb">작품명</label><input id="title" maxlength="60"></div><div><label class="lb">매체</label><select id="media"><option>책</option><option>영화</option><option>드라마</option></select></div></div>
 <label class="lb">말투</label><div class="chips" id="tone"><button data-k="hapnida" class="on">~습니다</button><button data-k="yo">~요</button><button data-k="da">~다</button></div>
 <label class="lb">메모 <i>한 줄에 하나 · 인용은 "따옴표"로</i></label>
 <textarea id="memo" rows="9" maxlength="6000"></textarea>
</section>
<button class="btn pri" id="runBtn" style="margin-top:14px">리뷰로 다듬기</button>
<section class="card hide" id="result">
 <h2><span class="n">2</span>블로그 리뷰</h2>
 <div id="spoil"></div>
 <div class="row"><button class="btn pri sm" id="copyBtn">전체 복사</button><button class="btn sec sm" id="printBtn">인쇄</button></div>
 <h3>제목 5개</h3><div id="titles"></div>
 <h3>본문 3문단</h3><div id="body"></div>
 <p class="chg" id="chg"></p>
 <h3>해시태그 15개</h3><div class="tags" id="tags"></div>
 <p class="kv">문단 나누기: ① 읽게/보게 된 계기·처음 인상 ② 장면·문장·인상 깊은 점 ③ 권하고 싶은 사람. 문단에 맞는 메모가 없으면 비워 두고 "메모를 더 적어 주세요"로 표시합니다.</p>
</section>
<!--@@BOTTOM@@-->
</main></div>
<div id="toast"></div><div id="printArea"></div>
<script>
/*@@JS@@*/
const S1 = {title:'바다가 들리는 편의점', media:'책', memo:`퇴근길에 동네 서점에서 표지가 예뻐서 샀다
진짜 진짜 첫 장부터 너무너무 따뜻한 느낌이었음
편의점 야간 알바생이 손님들 사연을 듣는 이야기
"오늘도 누군가는 불을 켜 두고 기다린다" 이 문장이 제일 좋았다
새벽 세 시에 할머니가 우유를 사러 오는 장면에서 눈물이 났다
새벽 세 시에 할머니가 우유를 사러 오는 장면에서 눈물이 났다
그냥 약간 후반부는 조금 늘어지는 느낌도 있었다
결말에서 편의점이 문을 닫지만 사람들이 다시 모이는 게 좋았다
야근 많은 직장인 친구들한테 추천하고 싶다
잠 안 오는 밤에 읽기 좋은 책이다`};
const S2 = {title:'여름의 끝, 기차역', media:'영화', memo:`주말에 넷플릭스에서 우연히 봤음 ㅋㅋ
화면 색감이 완전 예쁘다
오래된 기차역에서 두 친구가 10년 만에 다시 만나는 이야기
"늦었다고 생각한 날이 제일 빠른 날이야" 대사가 기억에 남는다
기차가 떠나는 장면에서 음악이 정말 좋았다
대사가 적어서 지루할 수도 있음
마지막 반전에서 편지를 쓴 사람이 친구 동생이라는 게 밝혀진다
조용한 영화 좋아하는 사람한테 권하고 싶다`};
const FILLER = [[/진짜\s*진짜\s*/g, ''], [/진짜\s+/g, ''], [/너무너무/g, '너무'], [/완전\s+/g, ''], [/그냥\s+/g, ''], [/약간\s+/g, ''], [/\s*ㅋ+|\s*ㅎ+|\s*ㅠ+|\s*ㅜ+/g, ''], [/\s{2,}/g, ' ']];
const SPOIL = ['결말','마지막','반전','범인','죽는','죽었','엔딩','밝혀','스포'];
const END = {
 hapnida:[[/했다$/, '했습니다'], [/했음$/, '했습니다'], [/였다$/, '였습니다'], [/었다$/, '었습니다'], [/았다$/, '았습니다'], [/봤음$/, '봤습니다'], [/있었다$/, '있었습니다'], [/있음$/, '있습니다'], [/싶다$/, '싶습니다'], [/좋다$/, '좋습니다'], [/예쁘다$/, '예쁩니다'], [/남는다$/, '남습니다'], [/밝혀진다$/, '밝혀집니다'], [/이다$/, '입니다'], [/있다$/, '있습니다'], [/없다$/, '없습니다'], [/한다$/, '합니다'], [/된다$/, '됩니다'], [/(\S)다$/, '$1다']],
 yo:[[/었음$/, '었어요'], [/였음$/, '였어요'], [/했음$/, '했어요'], [/봤음$/, '봤어요'], [/있음$/, '있어요'], [/했다$/, '했어요'], [/였다$/, '였어요'], [/었다$/, '었어요'], [/았다$/, '았어요'], [/싶다$/, '싶어요'], [/좋다$/, '좋아요'], [/예쁘다$/, '예뻐요'], [/남는다$/, '남아요'], [/밝혀진다$/, '밝혀져요'], [/이다$/, '이에요'], [/있다$/, '있어요'], [/없다$/, '없어요'], [/한다$/, '해요'], [/된다$/, '돼요']],
 da:[[/었음$/, '었다'], [/였음$/, '였다'], [/했음$/, '했다'], [/봤음$/, '봤다'], [/있음$/, '있다'], [/이었음$/, '이었다'], [/느낌이었음$/, '느낌이었다']]
};
let TONE = 'hapnida', CUR = null;
function polish(line){
  const qs = []; let s = line.replace(/"[^"]*"|“[^”]*”/g, m => { qs.push(m); return `\u0000${qs.length - 1}\u0000`; });
  const before = s; FILLER.forEach(([re, to]) => s = s.replace(re, to)); s = s.trim().replace(/[.。!~]+$/, '');
  let changed = s !== before.trim().replace(/[.。!~]+$/, '');
  const rules = END[TONE]; let hit = false; for (const [re, to] of rules){ if (re.test(s)){ const n = s.replace(re, to); if (n !== s){ changed = true; hit = true; } s = n; break; } }
  /* 받침 ㅆ + 다(샀다·났다·좋았다) → 샀습니다 / 샀어요 */
  const pc = s.length > 1 ? s.charCodeAt(s.length - 2) : 0;
  if (!hit && TONE !== 'da' && /다$/.test(s) && pc >= 0xAC00 && pc <= 0xD7A3 && (pc - 0xAC00) % 28 === 20){ s = s.slice(0, -1) + (TONE === 'hapnida' ? '습니다' : '어요'); changed = true; }
  if (TONE === 'hapnida' && /음$/.test(s)){ s = s.replace(/음$/, '습니다'); changed = true; }
  s = s.replace(/\u0000(\d+)\u0000/g, (m, i) => qs[+i]);
  return {t:s + '.', changed};
}
function run(){
  const title = $('#title').value.trim(), media = $('#media').value; const raw = $('#memo').value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  if (!raw.length){ $('#memo').classList.add('miss'); return toast('메모를 적어 주세요'); } $('#memo').classList.remove('miss');
  const seen = new Set(); const lines = []; let dup = 0; raw.forEach(l => { const k = l.replace(/\s/g, ''); if (seen.has(k)){ dup++; return; } seen.add(k); lines.push(l); });
  const P1 = [], P2 = [], P3 = []; let chg = 0;
  lines.forEach((l, i) => { const p = polish(l); if (p.changed) chg++;
    if (/추천|권하|권해|좋을 것|읽기 좋은|보기 좋은|사람한테|사람에게|친구들한테|분들께/.test(l)) P3.push(p.t);
    else if (i < 3 && /샀|봤|읽었|빌렸|서점|극장|넷플릭스|우연히|선물|퇴근길|주말에|처음|첫 장|첫 장면|이야기|색감/.test(l)) P1.push(p.t);
    else P2.push(p.t); });
  const spoil = lines.filter(l => SPOIL.some(w => l.indexOf(w) >= 0));
  const quotes = lines.flatMap(l => (l.match(/"[^"]*"|“[^”]*”/g) || []));
  /* 태그 후보: 메모에 실제로 나온 낱말에서 조사만 떼어 냄(없는 말을 만들지 않음) */
  const words = (lines.join(' ').replace(/"[^"]*"/g, ' ').match(/[가-힣]{2,}/g) || []).map(w => w.replace(/(에서|한테|에게|으로|부터|까지|는|은|가|이|을|를|에|도|의|로|과|와)$/, '')).filter(w => w.length >= 2 && w.length <= 5 && !/[다요음었았했니던는운한할고서게며면지]$/.test(w));
  const freq = {}; words.forEach(w => freq[w] = (freq[w] || 0) + 1); const kw = Object.entries(freq).sort((a, b) => b[1] - a[1] || b[0].length - a[0].length).map(x => x[0]).filter(w => !/진짜|너무|그냥|약간|조금|정말|완전|느낌|있었|좋았|싶다|하는|에서/.test(w)).slice(0, 8);
  const T = title || '작품명', M = media; const bk = M === '책' ? `『${T}』` : `<${T}>`; const verb = M === '책' ? '읽고' : '보고';
  const q0 = quotes[0] ? quotes[0].replace(/["“”]/g, '') : '';
  const titles = [`${bk} ${verb} — ${M} 리뷰`, q0 ? `"${q0.length > 22 ? q0.slice(0, 22) + '…' : q0}" ${bk}` : `${bk}에서 기억에 남은 장면`, `${bk} 후기 · 이런 분께 권합니다`, `${M === '책' ? '독서' : '감상'} 기록: ${bk}`, `${bk} ${spoil.length ? '(스포일러 포함) ' : ''}솔직 후기`];
  const typ = {책:['책추천','독서기록','북스타그램','책리뷰','독서후기','읽을만한책'], 영화:['영화추천','영화리뷰','영화후기','무비스타그램','오늘의영화','영화기록'], 드라마:['드라마추천','드라마리뷰','드라마후기','정주행','드라마기록','오늘의드라마']}[M];
  const tg = [T.replace(/\s/g, ''), T.replace(/\s/g, '') + '후기', T.replace(/\s/g, '') + (M === '책' ? '서평' : '리뷰')].concat(typ, kw.map(w => w), ['블로그리뷰', '기록', '추천', '감상', '후기']);
  const tags = [...new Set(tg)].slice(0, 15).map(t => '#' + t);
  CUR = {title:T, media:M, bk, P:[P1, P2, P3], titles, tags, spoil, quotes, dup, chg};
  render();
}
function body(){ const H = ['① 만나게 된 계기', '② 인상 깊었던 장면·문장', '③ 이런 분께 권합니다']; return CUR.P.map((p, i) => ({h:H[i], t:p.length ? p.join(' ') : '(메모를 더 적어 주세요 — 이 문단은 비워 둡니다)'})); }
function render(){
  const R = CUR;
  $('#spoil').innerHTML = R.spoil.length ? `<div class="spoil">⚠ 스포일러 주의 — 결말·반전에 대한 내용이 있습니다 (${R.spoil.length}줄)</div>` : '';
  $('#titles').innerHTML = R.titles.map((t, i) => `<div class="item"><div class="q">${i + 1}. ${esc(t)}</div></div>`).join('');
  $('#body').innerHTML = body().map(b => `<div class="para"><h5>${b.h}</h5>${esc(b.t)}</div>`).join('');
  $('#chg').textContent = `다듬은 줄 ${R.chg}개 · 중복으로 뺀 줄 ${R.dup}개 · 인용 ${R.quotes.length}개는 원문 그대로`;
  $('#tags').innerHTML = R.tags.map(t => `<span>${esc(t)}</span>`).join('');
  $('#result').classList.remove('hide'); $('#result').scrollIntoView({block:'start'}); window.scrollBy(0, -60);
}
function full(){ return (CUR.spoil.length ? '⚠ 스포일러 주의 — 결말·반전 내용이 있습니다.\n\n' : '') + CUR.titles[0] + '\n\n' + body().filter((b, i) => CUR.P[i].length).map(b => b.t).join('\n\n') + '\n\n' + CUR.tags.join(' '); }
$$('#tone button').forEach(b => b.onclick = () => { TONE = b.dataset.k; $$('#tone button').forEach(x => x.classList.toggle('on', x === b)); if (CUR) run(); });
const load = S => { $('#title').value = S.title; $('#media').value = S.media; $('#memo').value = S.memo; toast('예시를 넣었습니다'); };
$('#sampleBtn').onclick = () => load(S1); $('#sample2Btn').onclick = () => load(S2);
$('#runBtn').onclick = run;
$('#copyBtn').onclick = () => CUR && copyOut(full(), '리뷰 전체를 복사했습니다');
$('#printBtn').onclick = () => { if (!CUR) return; printDoc(`<div class="paper"><h1>${esc(CUR.titles[0])}</h1>${CUR.spoil.length ? '<p class="note"><b>⚠ 스포일러 주의</b></p>' : ''}${body().map(b => `<h2>${b.h}</h2><p>${esc(b.t)}</p>`).join('')}<h2>제목 후보</h2><p>${CUR.titles.map(esc).join('<br>')}</p><h2>해시태그</h2><p>${CUR.tags.map(esc).join(' ')}</p></div>`); };
</script>
</body></html>
