<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KTS 더알바 — 근무표 + 주휴·야간·연장 계산 · KTS 원클릭</title>
<meta name="theme-color" content="#0A1128">
<style>
/*@@CSS@@*/
.grid{width:100%;border-collapse:collapse;table-layout:fixed;font-size:10.5px;margin-top:8px}
.grid th,.grid td{border:1px solid var(--line);padding:4px 1px;text-align:center;overflow-wrap:anywhere}
.grid th{color:var(--sub);font-weight:800}
.grid td.w{background:rgba(255,107,0,.16);color:#fff;font-weight:800}
.grid td.n{text-align:left;color:#fff;font-weight:800;padding-left:4px}
.pay{background:#0B1530;border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px;font-size:12px}
.pay .h{display:flex;justify-content:space-between;align-items:baseline}
.pay .h b{color:#fff;font-size:13.5px}.pay .h span{color:var(--or);font-size:16px;font-weight:900}
.pay table{width:100%;margin-top:5px;border-collapse:collapse}
.pay td{padding:2px 0;color:#D3DBE7}.pay td:last-child{text-align:right}
.pay .f{color:var(--sub);font-size:10.5px}
.mc{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:8px}
.mc div{min-height:44px;border-radius:6px;background:#0B1530;border:1px solid var(--line);font-size:9.5px;color:#DCE6F2;padding:2px;line-height:1.25;overflow:hidden}
.mc div b{display:block;color:var(--sub);font-size:10px}.mc div.h{visibility:hidden}
</style></head>
<body><div id="app">
<!--@@TOP KTS 더알바@@-->
<main>
<section class="hero">
 <h1>직원·시급·근무시간만 넣으면<br><em>근무표</em>와 주휴·야간·연장 급여</h1>
 <p>계산식과 가산 규칙을 화면에 그대로 보여 줍니다. 5인 이상/미만 사업장에 따라 가산 적용이 달라집니다. 실제 지급 전 노무 기준을 꼭 확인하세요.</p>
</section>
<section class="card">
 <h2><span class="n">1</span>직원 · 근무</h2>
 <div class="row"><button class="btn sec sm" id="sampleBtn">예시 직원 3명 넣기</button><button class="btn sec sm" id="clearBtn">지우기</button></div>
 <label class="lb">한 줄에 1명 <i>이름, 시급, 요일(월화수목금), 시작, 종료, 휴게(분)</i></label>
 <textarea id="emp" rows="5" maxlength="4000"></textarea>
 <div class="g2"><div><label class="lb">주 시작일(월)</label><input id="wk" type="date"></div><div><label class="lb">최저시급 기준(원)<i>직접 확인 후 입력</i></label><input id="minw" inputmode="numeric" value="10320"></div></div>
 <label class="lb">사업장 규모</label><div class="chips" id="size"><button data-k="5up" class="on">상시 5인 이상</button><button data-k="5dn">5인 미만</button></div>
</section>
<button class="btn pri" id="runBtn" style="margin-top:14px">근무표 · 급여 계산</button>
<section class="card hide" id="result">
 <h2><span class="n">2</span><span id="rTitle">주간 근무표</span></h2>
 <div class="stat"><div><b id="sN">0</b><span>직원</span></div><div><b id="sH">0</b><span>주 총 근무(시간)</span></div><div><b id="sPay">0</b><span>주 예상 급여(원)</span></div></div>
 <div class="row"><button class="btn pri sm" id="printBtn">인쇄</button><button class="btn sec sm" id="csvBtn">CSV 저장</button><button class="btn sec sm" id="copyBtn">명세 복사</button></div>
 <table class="grid" id="grid"></table>
 <h3>급여 명세 (주간 · 월 환산)</h3><div id="pays"></div>
 <h3>이번 달 근무 달력</h3><div class="mc" id="mcal"></div>
 <details class="rule" open><summary>계산식 · 가산 규칙 (공개)</summary><div id="rules"></div></details>
 <p class="fixnote" id="note"></p>
</section>
<!--@@BOTTOM@@-->
</main></div>
<div id="toast"></div><div id="printArea"></div>
<script>
/*@@JS@@*/
const S_EMP = `김하늘, 10320, 월화수목금, 09:00, 18:00, 60
이도윤, 10500, 토일, 10:00, 22:00, 60
박서윤, 11000, 화목금, 18:00, 02:00, 30`;
const DN = ['월', '화', '수', '목', '금', '토', '일'];
let SIZE = '5up', CUR = null;
const hm = s => { const m = /^(\d{1,2}):?(\d{2})$/.exec(String(s || '').trim()); return m ? +m[1] * 60 + +m[2] : NaN; };
function nightMin(st, en){ /* 22:00~06:00 겹치는 분 (자정 넘김 지원) */ let n = 0; for (let t = st; t < en; t++){ const h = (t % 1440) / 60; if (h >= 22 || h < 6) n++; } return n; }
function run(){
  const rows = parseCSV($('#emp').value).filter(r => r[0]); if (!rows.length){ $('#emp').classList.add('miss'); return toast('직원을 적어 주세요'); } $('#emp').classList.remove('miss');
  const wk = parseD($('#wk').value) || new Date(), minw = num($('#minw').value), big = SIZE === '5up';
  const E = rows.map(r => { const wage = num(r[1]); const days = DN.filter(d => (r[2] || '').indexOf(d) >= 0); const st = hm(r[3]); let en = hm(r[4]); const brk = num(r[5]) || 0; if (en <= st) en += 1440;
    const span = en - st, work = Math.max(0, span - brk), night = Math.max(0, nightMin(st, en) - (nightMin(st, en) > 0 && span > 0 ? Math.round(brk * nightMin(st, en) / span) : 0));
    const per = days.map(d => ({d, work, night, ot:Math.max(0, work - 480)}));
    const total = per.reduce((a, x) => a + x.work, 0), dailyOT = per.reduce((a, x) => a + x.ot, 0), reg = per.reduce((a, x) => a + Math.min(480, x.work), 0), weekOT = Math.max(0, reg - 2400), ot = dailyOT + weekOT, nt = per.reduce((a, x) => a + x.night, 0);
    const juhu = total >= 900 ? Math.min(reg, 2400) / 2400 * 480 : 0; /* 주 15시간 이상 → (주 소정근로 ÷ 40) × 8시간 */
    const base = total / 60 * wage, otP = big ? ot / 60 * wage * 0.5 : 0, ntP = big ? nt / 60 * wage * 0.5 : 0, juP = juhu / 60 * wage; const week = base + otP + ntP + juP;
    return {name:r[0], wage, days, st, en, brk, work, total, ot, nt, juhu, base, otP, ntP, juP, week, month:week * 365 / 7 / 12, low:isFinite(minw) && wage < minw, txt:`${r[3]}~${r[4]}`}; });
  CUR = {E, wk, big, minw}; render();
}
const h2 = m => Math.round(m / 60 * 100) / 100;
function render(){
  const R = CUR; const dates = DN.map((d, i) => addDays(R.wk, i));
  $('#rTitle').textContent = `주간 근무표 · ${ymd(R.wk)} ~ ${ymd(addDays(R.wk, 6))}`;
  $('#sN').textContent = R.E.length; $('#sH').textContent = h2(R.E.reduce((a, e) => a + e.total, 0)); $('#sPay').textContent = won(R.E.reduce((a, e) => a + e.week, 0));
  $('#grid').innerHTML = `<colgroup><col style="width:22%">${DN.map(() => '<col>').join('')}</colgroup><tr><th>직원</th>${dates.map((d, i) => `<th>${DN[i]}<br>${d.getDate()}</th>`).join('')}</tr>` + R.E.map(e => `<tr><td class="n">${esc(e.name)}</td>${DN.map(d => e.days.includes(d) ? `<td class="w">${e.txt.replace('~', '<br>~')}</td>` : '<td></td>').join('')}</tr>`).join('');
  $('#pays').innerHTML = R.E.map(e => `<div class="pay"><div class="h"><b>${esc(e.name)} ${e.low ? '<span class="pill hi" style="font-size:10px">최저시급 미만</span>' : ''}</b><span>${won(e.week)}원/주</span></div><table>
   <tr><td>기본급 = ${h2(e.total)}시간 × ${won(e.wage)}원</td><td>${won(e.base)}</td></tr>
   <tr><td>연장 가산 = ${h2(e.ot)}시간 × ${won(e.wage)} × 0.5 ${R.big ? '' : '(5인 미만: 미적용)'}</td><td>${won(e.otP)}</td></tr>
   <tr><td>야간 가산 = ${h2(e.nt)}시간 × ${won(e.wage)} × 0.5 ${R.big ? '' : '(5인 미만: 미적용)'}</td><td>${won(e.ntP)}</td></tr>
   <tr><td>주휴수당 = ${h2(e.juhu)}시간 × ${won(e.wage)}원 ${e.total < 900 ? '(주 15시간 미만: 없음)' : ''}</td><td>${won(e.juP)}</td></tr>
   <tr><td><b>월 환산(주 × 365 ÷ 7 ÷ 12, 추정)</b></td><td><b>${won(e.month)}</b></td></tr></table>
   <div class="f">${e.days.join('')} ${e.txt} · 휴게 ${e.brk}분 · 하루 실근무 ${h2(e.work)}시간 · 주 ${h2(e.total)}시간</div></div>`).join('');
  const y = R.wk.getFullYear(), m = R.wk.getMonth(), last = new Date(y, m + 1, 0).getDate(), first = (new Date(y, m, 1).getDay() + 6) % 7;
  let mc = DN.map(d => `<div style="min-height:0;background:none;border:0;text-align:center"><b>${d}</b></div>`).join(''); for (let i = 0; i < first; i++) mc += '<div class="h"></div>';
  for (let d = 1; d <= last; d++){ const dw = DN[(new Date(y, m, d).getDay() + 6) % 7]; const who = R.E.filter(e => e.days.includes(dw)).map(e => e.name.slice(-2)); mc += `<div><b>${d}</b>${who.map(esc).join('<br>')}</div>`; }
  $('#mcal').innerHTML = mc;
  $('#rules').innerHTML = `· 실근무 = 종료 − 시작 − 휴게 (자정 넘김 지원)<br>· 연장 = 하루 8시간 초과분 + (하루 8시간 이내 근무의 주 합계 − 40시간) 초과분 → 통상시급 × 0.5 가산 (총 1.5배)<br>· 야간 = 22:00~06:00 근무분(휴게는 비율로 차감) → 통상시급 × 0.5 가산<br>· 주휴 = 주 근무 15시간 이상일 때 (주 소정근로시간 ÷ 40) × 8시간 × 시급 (최대 8시간)<br>· 상시 5인 미만 사업장은 연장·야간 가산을 적용하지 않고 기본급·주휴만 계산<br>· 월 환산 = 주 급여 × 365 ÷ 7 ÷ 12 (추정)`;
  $('#note').textContent = `2026년 기준 최저임금 확인 필요 — 입력한 기준 ${won(R.minw)}원은 고용노동부 고시로 확인하세요. 5인 이상/미만 사업장은 가산수당 적용이 다릅니다. 근로계약·법률 판단이 아닌 계산 보조입니다.`;
  $('#result').classList.remove('hide'); $('#result').scrollIntoView({block:'start'}); window.scrollBy(0, -60);
}
const slip = () => CUR.E.map(e => `[${e.name}] 주 ${won(e.week)}원 (기본 ${won(e.base)} + 연장 ${won(e.otP)} + 야간 ${won(e.ntP)} + 주휴 ${won(e.juP)}) · 월 환산 ${won(e.month)}원`).join('\n');
$$('#size button').forEach(b => b.onclick = () => { SIZE = b.dataset.k; $$('#size button').forEach(x => x.classList.toggle('on', x === b)); if (CUR) run(); });
$('#sampleBtn').onclick = () => { $('#emp').value = S_EMP; const t = new Date(); $('#wk').value = ymd(addDays(t, -((t.getDay() + 6) % 7))); toast('예시 직원 3명을 넣었습니다'); };
$('#clearBtn').onclick = () => { $('#emp').value = ''; };
$('#runBtn').onclick = run;
$('#copyBtn').onclick = () => CUR && copyOut(`[주간 급여 명세] ${ymd(CUR.wk)} 주\n` + slip() + '\n※ 계산 보조 · 최저임금·가산 기준은 고용노동부 확인', '급여 명세를 복사했습니다');
$('#csvBtn').onclick = () => CUR && saveCSV(`근무급여_${ymd(CUR.wk)}.csv`, [['이름','시급','근무요일','시간','휴게(분)','주 근무(시간)','연장(시간)','야간(시간)','주휴(시간)','기본급','연장가산','야간가산','주휴수당','주 합계','월 환산(추정)','사업장']].concat(CUR.E.map(e => [e.name, e.wage, e.days.join(''), e.txt, e.brk, h2(e.total), h2(e.ot), h2(e.nt), h2(e.juhu), Math.round(e.base), Math.round(e.otP), Math.round(e.ntP), Math.round(e.juP), Math.round(e.week), Math.round(e.month), CUR.big ? '5인 이상' : '5인 미만'])));
$('#printBtn').onclick = () => { if (!CUR) return; const dates = DN.map((d, i) => addDays(CUR.wk, i)); printDoc(`<div class="paper"><h1>주간 근무표 · 급여 명세</h1><p class="note">${ymd(CUR.wk)} ~ ${ymd(addDays(CUR.wk, 6))} · ${CUR.big ? '상시 5인 이상' : '5인 미만'} · 계산 보조</p>
 <table><colgroup><col style="width:16%">${DN.map(() => '<col>').join('')}</colgroup><tr><th>직원</th>${dates.map((d, i) => `<th>${DN[i]} ${d.getDate()}</th>`).join('')}</tr>${CUR.E.map(e => `<tr><td>${esc(e.name)}</td>${DN.map(d => `<td>${e.days.includes(d) ? e.txt : ''}</td>`).join('')}</tr>`).join('')}</table>
 <h2>급여 명세</h2><table><tr><th>이름</th><th>주 근무</th><th>기본급</th><th>연장</th><th>야간</th><th>주휴</th><th>주 합계</th><th>월 환산</th></tr>${CUR.E.map(e => `<tr><td>${esc(e.name)}</td><td>${h2(e.total)}h</td><td>${won(e.base)}</td><td>${won(e.otP)}</td><td>${won(e.ntP)}</td><td>${won(e.juP)}</td><td>${won(e.week)}</td><td>${won(e.month)}</td></tr>`).join('')}</table>
 <p class="note">${$('#rules').innerHTML}</p><p class="note">${esc($('#note').textContent)}</p></div>`); };
const t0 = new Date(); $('#wk').value = ymd(addDays(t0, -((t0.getDay() + 6) % 7)));
</script>
</body></html>
