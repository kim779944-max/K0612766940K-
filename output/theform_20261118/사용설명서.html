const STEPS = [["01_home","1. 시작","[양식 사진 찍기 · 고르기]를 누릅니다. 기본 양식 5종(거래명세서·견적서·근로계약서·개인정보 동의서·신청서)은 아래 목록에서 바로 [열기]로 씁니다."],["02_auto_fix_after","2. 자동 보정","사진을 고르면 종이 네 귀퉁이를 찾아 기울기와 테두리를 바로잡고, 바탕을 하얗게 정리해 배경으로 깝니다."],["02b_auto_fix_before","2-1. 보정 전과 비교","[보정 전]을 누르면 찍은 원본을 봅니다. [보정 후]로 돌아와 [빈칸 지정으로]를 누릅니다."],["03_fields_tap","3. 빈칸 찍기","채울 자리를 누르면 칸이 생깁니다. 칸을 끌어 옮기고, 파란 점을 끌어 크기를 맞춥니다. [+] 칸 추가, [−] 칸 삭제, [되돌리기]는 10단계 넘게 돌아갑니다."],["03b_field_label_type","3-1. 이름표와 성격","칸마다 이름표(성명·금액·날짜)와 성격(글자·숫자·날짜·서명)을 정합니다. 숫자는 쉼표, 날짜는 \"2026년 11월 20일\"로 바뀌어 들어갑니다."],["03c_form_name","3-2. 내 양식으로 저장","양식 이름을 적고 [내 양식으로 저장]을 누르면 이 기기에 보관됩니다. 다음부터는 목록에서 바로 엽니다."],["06_my_list","4. 내 양식 목록","[열기]로 값 입력, [복제]로 비슷한 양식 만들기, [삭제]로 지우기. 기본 양식도 [복제]하면 칸 위치를 고칠 수 있습니다."],["04_custom_values","5. 값 입력","칸을 누르고 값을 칩니다. [음성 메모로 넣기]는 누른 칸에 말로 넣습니다. 입력값은 자동 저장됩니다."],["04b_custom_sign","5-1. 손가락 서명","서명 칸에는 손가락으로 서명합니다. 종이 위에는 서명 잉크만 얹힙니다."],["05_custom_preview","6. 미리보기","종이 위에 값이 얹힌 모습 그대로입니다. 인쇄·PDF도 이 모습으로 나갑니다."],["05b_custom_export","7. 내보내기","[한글 파일(.hwpx)] · [엑셀 파일(.xlsx)] · [인쇄 · PDF] 중에 고릅니다. 파일은 이 기기 안에서 만들어집니다."],["07_trade_values","8. 기본 양식: 자동 계산","거래명세서·견적서는 수량 × 단가 = 금액, 합계·부가세·총액이 자동으로 채워집니다. [손글씨 사진 읽기]는 내 제미나이 무료 열쇠가 있을 때만 씁니다."],["08_trade_preview","8-1. 기본 양식 미리보기","기본 양식은 A4 한 장 그대로 나옵니다."],["open_거래명세서_기본_hwpx","9. 저장한 파일 확인","저장한 파일은 더뷰(viewer.html)로 바로 열어 값이 들어갔는지 확인할 수 있습니다."],["12_key_sheet","10. AI 열쇠(선택)","손글씨 판독·빈칸 자동 인식을 쓸 때만 내 제미나이 무료 열쇠를 넣습니다. 열쇠는 이 기기에만 저장되고, 없어도 모든 기본 기능이 됩니다."],["11_inquiry","11. 60초 문의","이름·연락처·문의를 남기면 답장 초안이 바로 만들어집니다. 실제 발송은 담당자가 확인한 뒤에만 합니다."]];
const S = 180 / 390;
const fing = '<svg class="fing" viewBox="0 0 30 36"><path d="M9 3c1.7 0 3 1.3 3 3v10l1-.2V12c0-1.6 1.3-2.8 2.8-2.8S18.6 10.4 18.6 12v4l.8-.1c1.5 0 2.7 1.2 2.7 2.7v1l.6-.1c1.5 0 2.8 1.2 2.8 2.8V26c0 4.4-3.6 8-8 8h-3.3c-2.6 0-5-1.3-6.4-3.4L3.3 24c-.9-1.3-.6-3 .7-3.9 1.2-.8 2.8-.6 3.7.5L6 21V6c0-1.7 1.3-3 3-3z" fill="#fff" stroke="#0A1128" stroke-width="1.6"/></svg>';
const byShot = {}; (Array.isArray(MARKS) ? MARKS : [MARKS]).forEach(m => byShot[m.shot] = m.marks || []);
const card = s => {
  const [shot, h, p] = s; let ov = '';
  (byShot[shot] || []).forEach(m => {
    if (!m) return;
    if (m.kind === 'tap'){ const cx = (m.x + m.w / 2) * S, cy = (m.y + m.h / 2) * S;
      ov += '<div class="tap" style="left:' + cx + 'px;top:' + cy + 'px"></div><div style="position:absolute;left:' + cx + 'px;top:' + cy + 'px">' + fing + '</div>'; }
    else { const pd = 3; ov += '<div class="ring" style="left:' + (m.x * S - pd) + 'px;top:' + (m.y * S - pd) + 'px;width:' + (m.w * S + pd * 2) + 'px;height:' + (m.h * S + pd * 2) + 'px"></div>'; }
    if (m.note) ov += '<div class="lbl" style="left:' + Math.max(2, Math.min(80, m.x * S)) + 'px;top:' + Math.max(2, m.y * S - 14) + 'px">' + m.note + '</div>';
  });
  return '<div class="st"><div class="shot"><img src="' + shot + '.png">' + ov + '</div><div class="txt"><h2>' + h + '</h2><p>' + p + '</p></div></div>';
};
let html = ''; for (let i = 0; i < STEPS.length; i += 2) html += '<div class="pair">' + card(STEPS[i]) + (STEPS[i + 1] ? card(STEPS[i + 1]) : '<div class="st"></div>') + '</div>';
document.getElementById('list').innerHTML = html;
