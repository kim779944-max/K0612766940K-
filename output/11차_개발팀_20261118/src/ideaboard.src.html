<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>사업 아이디어 다각도 점검 · KTS 원클릭</title>
<meta name="theme-color" content="#0A1128">
<style>
/*@@CSS@@*/
.lens{margin-top:9px}
.lens h4{font-size:13px;color:#fff;font-weight:900}
.lens ol{margin:5px 0 0 18px;font-size:12.5px;color:#D3DBE7;line-height:1.6}
.lens ol li{margin-top:3px}
.ck{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--line);color:#E3E9F2}
.ck small{display:block;color:var(--sub);font-size:11px}
</style></head>
<body><div id="app">
<!--@@TOP 사업 아이디어 다각도 점검@@-->
<main>
<section class="hero">
 <h1>아이디어 한 줄을 넣으면<br><em>마케팅·재무·법률</em> 3렌즈 점검</h1>
 <p>렌즈별 7문항(총 21문항), 입력값 기준 손익분기, 업종별 인허가 확인 목록, 첫 7일 액션 표를 만듭니다. 매출을 예측하지 않고, 법·세무를 단정하지 않습니다.</p>
</section>
<section class="card">
 <h2><span class="n">1</span>아이디어 · 숫자</h2>
 <div class="row"><button class="btn sec sm" id="sampleBtn">예시 1 · 반찬 구독</button><button class="btn sec sm" id="sample2Btn">예시 2 · 온라인 강의</button></div>
 <label class="lb">아이디어 한 줄</label><input id="idea" maxlength="80">
 <label class="lb">대상 고객</label><input id="target" maxlength="60">
 <div class="g2"><div><label class="lb">업종</label><select id="kind"><option value="food">식품 제조·판매</option><option value="online">온라인 상품 판매</option><option value="edu">교육·강의</option><option value="service">출장·방문 서비스</option><option value="app">앱·디지털 서비스</option><option value="beauty">뷰티·미용</option><option value="etc">기타</option></select></div><div><label class="lb">혼자 / 팀</label><select id="team"><option value="solo">혼자</option><option value="team">팀</option></select></div></div>
 <div class="g2"><div><label class="lb">판매 가격(원)</label><input id="price" inputmode="numeric"></div><div><label class="lb">건당 원가(원)</label><input id="cost" inputmode="numeric"></div></div>
 <div class="g2"><div><label class="lb">판매 수수료(%)<i>플랫폼·카드</i></label><input id="fee" inputmode="decimal"></div><div><label class="lb">월 고정비(원)<i>임대·구독 등</i></label><input id="fixed" inputmode="numeric"></div></div>
 <label class="lb">초기 자본(원)</label><input id="capital" inputmode="numeric">
</section>
<button class="btn pri" id="runBtn" style="margin-top:14px">3렌즈로 점검하기</button>
<section class="card hide" id="result">
 <h2><span class="n">2</span><span id="rTitle">점검 결과</span></h2>
 <div class="stat"><div><b id="sMargin">-</b><span>건당 마진(원)</span></div><div><b id="sBep">-</b><span>월 손익분기(개)</span></div><div><b id="sBack">-</b><span>자본 회수(개)</span></div></div>
 <div class="row"><button class="btn pri sm" id="printBtn">인쇄</button><button class="btn sec sm" id="copyBtn">전체 복사</button></div>
 <p class="kv" id="pl"></p>
 <h3>3렌즈 질문 21개</h3><div id="lens"></div>
 <h3>법 · 인허가 확인 목록</h3><div id="legal"></div>
 <h3>첫 7일 액션</h3><div id="week"></div>
 <p class="fixnote">일반 안내이며 인허가·세무는 관할 기관·전문가 확인이 필요합니다.</p>
</section>
<!--@@BOTTOM@@-->
</main></div>
<div id="toast"></div><div id="printArea"></div>
<script>
/*@@JS@@*/
const S1 = {idea:'1인 가구용 주 3회 반찬 정기배송', target:'미사·하남 30~40대 1인 가구 직장인', kind:'food', team:'solo', price:39000, cost:21000, fee:6.6, fixed:1200000, capital:8000000};
const S2 = {idea:'자영업자용 엑셀 자동화 온라인 강의', target:'직원 5명 이하 매장 사장님', kind:'edu', team:'team', price:99000, cost:5000, fee:10, fixed:300000, capital:2000000};
const LENS = [
 ['① 고객은 왜 사는가 (마케팅)', ['{T}은(는) 지금 이 문제를 무엇으로 해결하고 있나요? 그 방법의 불편한 점 3가지는?','{T} 10명에게 직접 물어본다면 첫 질문은 무엇인가요? (이번 주 안에 누구에게?)','"{I}"를 한 문장으로 설명할 때, 경쟁 대안과 다른 점 1가지는?','{T}이(가) 처음 이 상품을 알게 되는 곳(검색·지인·SNS·매장)은 어디인가요?','{P}원이 비싸다고 느낄 때, 고객이 비교하는 금액은 얼마인가요?','첫 구매 후 두 번째 구매를 하게 만드는 이유는 무엇인가요?','고객이 불만을 말할 창구와 답하는 기준(시간·담당)은 정했나요?']],
 ['② 돈은 어디서 남는가 (재무)', ['건당 마진 {M}원이 맞는지, 원가에 빠진 항목(포장·배송·결제·반품)은 없나요?','월 손익분기 {B}개는 하루 몇 개인가요? (영업일 기준으로 나눠 보기)','초기 자본 {C}원 중 재고·설비·광고에 각각 얼마를 쓰나요?','판매가를 10% 올리거나 원가를 10% 낮추면 손익분기가 어떻게 바뀌나요?','{TEAM}','현금이 들어오는 날(정산일)과 나가는 날(구매·임대)의 차이는 며칠인가요?','최악의 달(판매 절반)에 몇 개월 버틸 수 있나요?']],
 ['③ 무엇이 걸리는가 (법·운영)', ['이 업종에 필요한 신고·등록·허가는 무엇인지 관할 기관에 확인했나요?','상품 표시(원산지·성분·주의사항)나 광고 문구에 제한이 있는 표현은 없나요?','고객 개인정보(이름·연락처·주소)를 어디에 저장하고 누가 볼 수 있나요?','환불·교환 기준을 판매 페이지에 적었나요?','혼자 아플 때나 재료가 떨어질 때 대신할 방법이 있나요?','다른 사람의 이름·로고·사진·글을 허락 없이 쓰고 있지 않나요?','보험(배상책임 등)이 필요한 일인지 확인했나요?']]
];
const LEGAL = {
 food:['사업자등록(관할 세무서·홈택스)','식품 관련 영업 신고·등록 종류 확인(제조·즉석판매·통신판매 등) — 관할 시·군·구청 위생과','위생교육 이수 여부 확인','식품 표시 기준(원산지·알레르기·소비기한) 확인','통신판매업 신고(온라인 판매 시)','배송 중 온도 관리 기준 확인'],
 online:['사업자등록','통신판매업 신고(시·군·구청 또는 정부24)','전자상거래 고지(사업자 정보·청약철회·환불) 판매 페이지 표시','KC 인증 등 상품별 인증 대상 여부 확인','개인정보 처리방침 게시'],
 edu:['사업자등록','교습소·학원 등록 대상인지 확인(오프라인 강의 시 관할 교육지원청)','온라인 강의 판매 시 통신판매업 신고 여부 확인','수강 환불 기준 표시','강의 자료 저작권(이미지·글꼴·예제) 확인','개인정보 처리방침 게시'],
 service:['사업자등록','방문 업종별 자격·등록 필요 여부 확인','배상책임보험 필요 여부 확인','견적·계약서 양식 준비','개인정보(주소·연락처) 보관 기준'],
 app:['사업자등록','이용약관·개인정보 처리방침 게시','위치정보 등 수집 시 신고·동의 필요 여부 확인','결제 대행(PG) 계약 조건 확인','앱 마켓 정책·환불 기준 확인'],
 beauty:['사업자등록','미용업 영업 신고·면허 필요 여부 확인(관할 시·군·구청)','화장품 판매 시 책임판매업 등 등록 여부 확인','위생 점검 기준 확인','시술 동의서·주의사항 안내'],
 etc:['사업자등록','업종별 신고·등록·허가 대상 여부 관할 기관 확인','통신판매업 신고(온라인 판매 시)','개인정보 처리방침','계약서·환불 기준']
};
const WEEK = {solo:['고객 후보 10명 목록 만들고 3명에게 연락','원가표(재료·포장·배송·수수료) 한 장 정리','관할 기관에 필요한 신고·등록 확인 전화/방문','시제품·샘플 1개 만들어 사진 찍기','판매 페이지 초안(가격·환불 기준 포함) 작성','지인 5명에게 테스트 판매·피드백 받기','숫자 다시 계산 → 계속/수정/중단 결정'],
 team:['역할 나누기(만들기·팔기·돈 관리) 표 작성','고객 후보 20명 인터뷰 질문 3개 확정','원가·손익분기 표 공유 문서로 정리','관할 기관 신고·등록 확인(담당 1명)','시제품·샘플 + 판매 페이지 초안','첫 테스트 판매 10건 목표 실행','회고: 숫자·피드백 보고 다음 2주 계획']};
let CUR = null;
const fill = (s, R) => s.replace(/\{T\}/g, R.target || '대상 고객').replace(/\{I\}/g, R.idea).replace(/\{P\}/g, won(R.price)).replace(/\{M\}/g, isFinite(R.margin) ? won(R.margin) : '(입력 필요)').replace(/\{B\}/g, isFinite(R.bep) ? won(R.bep) : '(입력 필요)').replace(/\{C\}/g, isFinite(R.capital) ? won(R.capital) : '(입력 필요)')
  .replace('{TEAM}', R.team === 'team' ? '팀원 몫(급여·지분)은 손익에 넣었나요? 넣으면 손익분기는 몇 개로 늘어나나요?' : '대표 본인 인건비(시간당 얼마)를 넣으면 손익분기는 몇 개로 늘어나나요?');
function run(){
  const idea = $('#idea').value.trim(); if (!idea){ $('#idea').classList.add('miss'); return toast('아이디어를 한 줄 적어 주세요'); } $('#idea').classList.remove('miss');
  const price = num($('#price').value), cost = num($('#cost').value), fee = num($('#fee').value) || 0, fixed = num($('#fixed').value), capital = num($('#capital').value);
  const margin = isFinite(price) && isFinite(cost) ? price - cost - price * fee / 100 : NaN;
  const bep = isFinite(margin) && margin > 0 && isFinite(fixed) ? Math.ceil(fixed / margin) : NaN, back = isFinite(margin) && margin > 0 && isFinite(capital) ? Math.ceil(capital / margin) : NaN;
  CUR = {idea, target:$('#target').value.trim(), kind:$('#kind').value, team:$('#team').value, price, cost, fee, fixed, capital, margin, bep, back};
  CUR.lens = LENS.map(([h, qs]) => [h, qs.map(q => fill(q, CUR))]); CUR.legal = LEGAL[CUR.kind]; CUR.week = WEEK[CUR.team];
  render();
}
function render(){
  const R = CUR; $('#rTitle').textContent = R.idea;
  $('#sMargin').textContent = isFinite(R.margin) ? won(R.margin) : '입력 필요'; $('#sBep').textContent = isFinite(R.bep) ? won(R.bep) : (isFinite(R.margin) && R.margin <= 0 ? '적자' : '입력 필요'); $('#sBack').textContent = isFinite(R.back) ? won(R.back) : '-';
  $('#pl').textContent = isFinite(R.margin) ? `건당 마진 = 가격 ${won(R.price)} − 원가 ${won(R.cost)} − 수수료 ${R.fee}%(${won(R.price * R.fee / 100)}) = ${won(R.margin)}원` + (isFinite(R.bep) ? ` · 월 손익분기 = 고정비 ${won(R.fixed)} ÷ ${won(R.margin)} = ${won(R.bep)}개(하루 약 ${Math.ceil(R.bep / 25)}개, 25일 기준)` : '') + (isFinite(R.back) ? ` · 초기 자본 회수 = ${won(R.capital)} ÷ ${won(R.margin)} = ${won(R.back)}개` : '') + (R.margin <= 0 ? ' — 팔수록 손해입니다. 가격·원가를 다시 보세요.' : '') + ' (입력값 기준 계산이며 매출을 예측하지 않습니다)' : '가격·원가를 넣으면 손익분기를 계산합니다.';
  $('#lens').innerHTML = R.lens.map(([h, qs]) => `<div class="lens item"><h4>${h}</h4><ol>${qs.map(q => `<li>${esc(q)}</li>`).join('')}</ol></div>`).join('');
  const ck = LS.get('kts_idea_ck_v1', {});
  $('#legal').innerHTML = R.legal.map(l => `<label class="ck"><input type="checkbox" data-k="${esc(R.kind + '|' + l)}" ${ck[R.kind + '|' + l] ? 'checked' : ''}><span>${esc(l)}<small>확인 필요 — 확정 아님</small></span></label>`).join('');
  $$('#legal input').forEach(c => c.onchange = () => { const o = LS.get('kts_idea_ck_v1', {}); if (c.checked) o[c.dataset.k] = 1; else delete o[c.dataset.k]; LS.set('kts_idea_ck_v1', o); });
  $('#week').innerHTML = `<table class="t"><colgroup><col style="width:52px"><col></colgroup><tr><th>일</th><th>할 일</th></tr>${R.week.map((w, i) => `<tr><td>${i + 1}일차</td><td>${esc(w)}</td></tr>`).join('')}</table>`;
  $('#result').classList.remove('hide'); $('#result').scrollIntoView({block:'start'}); window.scrollBy(0, -60);
}
const full = () => `[아이디어 점검] ${CUR.idea}\n대상: ${CUR.target}\n${$('#pl').textContent}\n\n` + CUR.lens.map(([h, qs]) => h + '\n' + qs.map((q, i) => `${i + 1}. ${q}`).join('\n')).join('\n\n') + '\n\n[법·인허가 확인 목록]\n' + CUR.legal.map(l => '□ ' + l).join('\n') + '\n\n[첫 7일]\n' + CUR.week.map((w, i) => `${i + 1}일차: ${w}`).join('\n') + '\n\n※ 일반 안내이며 인허가·세무는 관할 기관·전문가 확인이 필요합니다.';
const load = S => { ['idea', 'target', 'kind', 'team', 'price', 'cost', 'fee', 'fixed', 'capital'].forEach(k => $('#' + k).value = S[k]); toast('예시를 넣었습니다'); };
$('#sampleBtn').onclick = () => load(S1); $('#sample2Btn').onclick = () => load(S2);
$('#runBtn').onclick = run;
$('#copyBtn').onclick = () => CUR && copyOut(full(), '점검 결과를 복사했습니다');
$('#printBtn').onclick = () => { if (!CUR) return; const R = CUR; printDoc(`<div class="paper"><h1>사업 아이디어 점검표</h1><p class="note">${esc(R.idea)} · 대상: ${esc(R.target)}</p><p>${esc($('#pl').textContent)}</p>
 ${R.lens.map(([h, qs]) => `<h2>${h}</h2><table><colgroup><col style="width:5%"><col><col style="width:28%"></colgroup>${qs.map((q, i) => `<tr><td>${i + 1}</td><td>${esc(q)}</td><td>메모:</td></tr>`).join('')}</table>`).join('')}
 <h2>법·인허가 확인 목록</h2><p>${R.legal.map(l => '□ ' + esc(l)).join('<br>')}</p><h2>첫 7일 액션</h2><p>${R.week.map((w, i) => `${i + 1}일차 □ ${esc(w)}`).join('<br>')}</p><p class="note">일반 안내이며 인허가·세무는 관할 기관·전문가 확인이 필요합니다.</p></div>`); };
</script>
</body></html>
