<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>60초 무료 안내 신청 · 번개알바</title>
<meta name="theme-color" content="#0A1128">
<style>
  :root{
    --navy:#0A1128; --navy2:#111B36; --card:#16223F; --line:#24314F;
    --orange:#FF6B00; --ink:#ECEFF4; --dim:#93A0B4; --green:#35C48A;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--navy);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
  .wrap{max-width:430px;margin:0 auto;padding:22px 18px 40px}
  .brand{display:flex;align-items:center;gap:7px;font-size:12px;letter-spacing:.08em;color:var(--orange);font-weight:700;margin-bottom:12px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--orange);box-shadow:0 0 10px var(--orange)}
  h1{font-size:25px;line-height:1.3;margin:14px 0 6px;font-weight:800;word-break:keep-all;overflow-wrap:break-word}
  h1 em{font-style:normal;color:var(--orange)}
  .sub{font-size:13px;color:var(--dim);line-height:1.6;margin:0 0 18px;word-break:keep-all}
  .badge{display:block;width:fit-content;background:rgba(255,107,0,.12);color:var(--orange);
    border:1px solid rgba(255,107,0,.35);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;margin-bottom:14px}
  label{display:block;font-size:12px;color:var(--dim);margin:14px 0 6px;font-weight:600}
  input,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;
    color:var(--ink);font-size:15px;padding:13px 14px;outline:none;font-family:inherit}
  input:focus,textarea:focus{border-color:var(--orange)}
  textarea{min-height:78px;resize:vertical}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .chip{flex:1;min-width:110px;text-align:center;padding:12px 8px;border-radius:12px;background:var(--card);
    border:1px solid var(--line);font-size:13px;color:var(--dim);cursor:pointer;user-select:none}
  .chip.on{background:var(--orange);color:#1a0d00;border-color:var(--orange);font-weight:800}
  button{width:100%;margin-top:20px;padding:17px;border:0;border-radius:14px;background:var(--orange);
    color:#fff;font-size:16px;font-weight:800;letter-spacing:.01em;cursor:pointer}
  button:active{transform:translateY(1px)}
  .foot{margin-top:16px;font-size:11px;color:var(--dim);line-height:1.7;text-align:center}
  .done{display:none;text-align:center;padding:30px 6px}
  .done .big{font-size:22px;font-weight:800;margin:10px 0 8px}
  .done p{font-size:13px;color:var(--dim);line-height:1.7;margin:0 0 18px}
  .ico{width:62px;height:62px;border-radius:50%;background:rgba(53,196,138,.14);border:1px solid rgba(53,196,138,.5);
    display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:29px;color:var(--green)}
  a.link{color:var(--orange);text-decoration:none;font-size:13px}
  iframe{display:none}
</style>
</head>
<body>
<div class="wrap">

  <div class="brand"><span class="dot"></span>번개알바 · 소상공인 무료 지원</div>

  <div id="form-area">
    <div class="badge">오늘 중 연락 · 비용 0원</div>
    <h1>60초만 주세요.<br><em>업소 홍보와 구인</em>, 무료로 도와드립니다.</h1>
    <p class="sub">연락처만 남겨 주시면 담당자가 바로 연락드립니다.
      전화를 못 받으셨어도 괜찮습니다. 아래 폼이면 충분합니다.</p>

    <!-- CORS 회피: 숨은 iframe 으로 전송 -->
    <iframe name="sink" src="about:blank"></iframe>
    <form id="f" method="POST" target="sink" action="__HOOK__" accept-charset="utf-8">
      <input type="hidden" name="type" value="lead">
      <input type="hidden" name="source" value="form60">
      <input type="hidden" name="want" id="want" value="무료 홍보 + 구인">

      <label>업체명 / 상호 <span style="color:var(--orange)">*</span></label>
      <input type="text" name="name" id="name" placeholder="예) 미사동 000식당" required maxlength="40">

      <label>연락처 <span style="color:var(--orange)">*</span></label>
      <input type="tel" name="tel" id="tel" placeholder="010-0000-0000" inputmode="numeric" required maxlength="20">

      <label>원하시는 것</label>
      <div class="chips" id="chips">
        <div class="chip on" data-v="무료 홍보 + 구인">무료 홍보 + 구인</div>
        <div class="chip" data-v="구인(알바)">구인(알바)</div>
        <div class="chip" data-v="홍보만">홍보만</div>
      </div>

      <label>남기실 말 (선택)</label>
      <textarea name="text" placeholder="예) 주말 저녁 홀 알바 1명 구합니다"></textarea>

      <button type="submit" id="go">60초 접수 완료하기</button>
      <div class="foot">접수 내용은 안내 목적으로만 사용하며,<br>원치 않으시면 언제든 연락을 중단합니다.</div>
    </form>
  </div>

  <div class="done" id="done">
    <div class="ico">✓</div>
    <div class="big">접수되었습니다.</div>
    <p>담당자가 확인하고 <b>오늘 중으로</b> 연락드립니다.<br>
      급하시면 이 화면을 닫고 받으신 문자로 답장 주셔도 됩니다.</p>
    <a class="link" href="#" onclick="location.reload();return false;">한 건 더 접수하기</a>
  </div>

</div>

<script>
/* ───────────────────────────────────────────────
   배포 후 아래 HOOK 에 Apps Script 웹앱 /exec 주소를 넣으세요.
   (또는 이 페이지 주소에 ?h=https://script.google.com/…/exec 를 붙이면 그 값이 우선)
   예) misa-1116/form.html?h=https://script.google.com/macros/s/AKfy…/exec
   ─────────────────────────────────────────────── */
var HOOK = "__HOOK__";
try {
  var h = new URLSearchParams(location.search).get('h');
  if (h && h.indexOf('http') === 0) HOOK = h;
} catch (e) {}
document.getElementById('f').action = HOOK;

document.getElementById('chips').addEventListener('click', function (e) {
  var c = e.target.closest('.chip');
  if (!c) return;
  [].forEach.call(document.querySelectorAll('.chip'), function (x) { x.classList.remove('on'); });
  c.classList.add('on');
  document.getElementById('want').value = c.getAttribute('data-v');
});

document.getElementById('f').addEventListener('submit', function (e) {
  var name = document.getElementById('name').value.trim();
  var tel = document.getElementById('tel').value.replace(/[^0-9]/g, '');
  if (!name) { e.preventDefault(); alert('업체명을 입력해 주세요.'); return; }
  if (tel.length < 9) { e.preventDefault(); alert('연락처를 정확히 입력해 주세요.'); return; }
  if (!HOOK || HOOK.indexOf('__HOOK__') === 0) {
    e.preventDefault();
    alert('접수 주소가 아직 설정되지 않았습니다. 문자로 회신 주시면 바로 연락드립니다.');
    return;
  }
  setTimeout(function () {
    document.getElementById('form-area').style.display = 'none';
    document.getElementById('done').style.display = 'block';
    window.scrollTo(0, 0);
  }, 350);
});
</script>
</body>
</html>
